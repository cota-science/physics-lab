<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>気体分子ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="lab.css">
<script src="../js/italic.js"></script>
<script src="lab-common.js"></script>
</head>
<body>
<script>
(function(){
"use strict";
const {f, S, V, css, prep, arrow, label, symFont, uiFont, numFont, fit, disc, table, graph} = LAB;
const Rg = 8.3;

/* 乱数（同じ設定なら同じ分子の並びにする） */
function rng(seed){ let s = seed >>> 0; return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(u === 0) u = r(); v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function heat(tK){ // 温度の色（青 → 赤）
  const x = Math.max(0, Math.min(1, (tK - 100)/1100));
  return `hsl(${220 - 220*x}, 75%, ${48 + 6*Math.sin(x*Math.PI)}%)`;
}

/* ---------- 分子の運動と圧力（2次元モデル） ---------- */
const C = 0.035;   // 速さの目盛り：√T に比例（箱の高さ ＝ 1）
const kinetic = {
  label:"分子の運動と圧力",
  params:[["N","分子の数 "+S("N"),20,300,10,"個",0,100],["T","温度 "+S("T"),100,1200,10,"K",0,300],["W","箱の横幅（体積）",0.4,1.6,0.05,"",2,1]],
  toggles:[["color","速さで色分け",true],["track","1個を追跡",true]],
  timed:true, graphs:2, dt:1/240,
  legend:`<span><i style="background:#3a7bd5"></i>遅い分子</span><span><i style="background:#d9533b"></i>速い分子</span><span><i style="background:var(--acc)"></i>追跡する分子</span>`,
  reset(P, St){
    const r = rng(12345 + P.N), sig = C*Math.sqrt(P.T);
    St.ps = Array.from({length:P.N}, () => ({x:r()*P.W, y:r(), vx:sig*gauss(r), vy:sig*gauss(r)}));
    St.imp = []; St.pts = []; St.trail = [];
  },
  duration(){ return 60; },
  step(P, St, dt, t){
    let J = 0;
    St.ps.forEach(q => {
      q.x += q.vx*dt; q.y += q.vy*dt;
      if(q.x < 0){ q.x = -q.x; q.vx = -q.vx; J += 2*Math.abs(q.vx); }
      if(q.x > P.W){ q.x = 2*P.W - q.x; q.vx = -q.vx; J += 2*Math.abs(q.vx); }
      if(q.y < 0){ q.y = -q.y; q.vy = -q.vy; J += 2*Math.abs(q.vy); }
      if(q.y > 1){ q.y = 2 - q.y; q.vy = -q.vy; J += 2*Math.abs(q.vy); }
    });
    St.imp.push([t + dt, J]); while(St.imp.length && St.imp[0][0] < t + dt - 2) St.imp.shift();
    const tr = St.ps[0]; St.trail.push([tr.x, tr.y]); if(St.trail.length > 240) St.trail.shift();
    if(!St.lastP || t + dt - St.lastP >= 0.1){
      const span = Math.min(2, t + dt), Jsum = St.imp.reduce((a, b) => a + b[1], 0);
      if(span > 0.2) St.pts.push([t + dt, Jsum/(2*(P.W + 1))/span]);
      St.lastP = t + dt;
    }
  },
  draw(ctx){
    const {P, S:St, t, T} = ctx; const {c, w, h} = prep(ctx.stage);
    const tf = fit(w, h, {x0:-0.05, x1:1.75, y0:-0.05, y1:1.05}, 8);
    const ink2 = css("--ink2"), acc = css("--acc");
    c.fillStyle = css("--surface2"); c.fillRect(tf.X(0), tf.Y(1), P.W*tf.s, tf.s);
    c.strokeStyle = ink2; c.lineWidth = 2; c.strokeRect(tf.X(0), tf.Y(1), P.W*tf.s, tf.s);
    c.fillStyle = ink2; c.fillRect(tf.X(P.W), tf.Y(1), 8, tf.s);   // ピストン
    label(c, "ピストン", tf.X(P.W) + 12, tf.Y(0.5), ink2, "left", uiFont(11));
    if(T.track && St.trail.length > 1){ c.strokeStyle = acc; c.globalAlpha = 0.6; c.lineWidth = 1.4; c.beginPath(); St.trail.forEach((q, i) => i ? c.lineTo(tf.X(q[0]), tf.Y(q[1])) : c.moveTo(tf.X(q[0]), tf.Y(q[1]))); c.stroke(); c.globalAlpha = 1; }
    const vref = C*Math.sqrt(P.T)*Math.sqrt(2);
    St.ps.forEach((q, i) => {
      const sp = Math.hypot(q.vx, q.vy), x = Math.min(1, sp/(2*vref));
      c.fillStyle = (T.track && i === 0) ? acc : T.color ? `hsl(${220 - 210*x}, 70%, 50%)` : css("--pos");
      c.beginPath(); c.arc(tf.X(q.x), tf.Y(q.y), (T.track && i === 0) ? 5 : 3.2, 0, 7); c.fill();
    });
    // 速さの分布
    const {c:g, w:gw, h:gh} = prep(ctx.graphs[0]);
    const nb = 20, vmax = 3*vref, bins = new Array(nb).fill(0);
    St.ps.forEach(q => { const k = Math.floor(Math.hypot(q.vx, q.vy)/vmax*nb); if(k < nb) bins[k]++; });
    const pl = 8, pr = 8, pt = 22, pb = 16, bmax = Math.max(...bins, 1)*1.15;
    g.font = uiFont(12); g.fillStyle = css("--ink2"); g.textBaseline = "middle"; g.textAlign = "left"; g.fillText("速さの分布（線：理論の分布）", pl + 4, 10);
    bins.forEach((b, i) => { const x0 = pl + i/nb*(gw - pl - pr), bw = (gw - pl - pr)/nb - 1, hh = b/bmax*(gh - pt - pb); g.fillStyle = `hsl(${220 - 210*Math.min(1, (i + 0.5)/nb*1.5)}, 70%, 55%)`; g.fillRect(x0, gh - pb - hh, bw, hh); });
    const s2 = vref*vref/2; g.strokeStyle = css("--ink2"); g.lineWidth = 1.6; g.beginPath();
    for(let i = 0; i <= 100; i++){ const vv = vmax*i/100, pdf = vv/s2*Math.exp(-vv*vv/(2*s2)), cnt = pdf*P.N*vmax/nb; const X = pl + i/100*(gw - pl - pr), Y = gh - pb - cnt/bmax*(gh - pt - pb); i ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke();
    g.font = numFont(10); g.fillStyle = css("--ink3"); g.textAlign = "right"; g.fillText("速さ →", gw - pr, gh - 4);
    // 圧力
    const v2 = St.ps.reduce((a, q) => a + q.vx*q.vx + q.vy*q.vy, 0)/P.N, pth = P.N*v2/(2*P.W);
    const last = St.pts.length ? St.pts[St.pts.length - 1][1] : 0;
    graph(ctx.graphs[1], {title:"圧力（相対値）：測定と理論", unit:"", tmax:Math.max(10, t), t, ylo:0, yhi:Math.max(pth, last)*1.5 || 1, series:[{pts:St.pts, color:"--pos", name:"測定"}, {fn:() => pth, color:"--acc", name:"理論"}]});
    ctx.banner(`壁が受けた力積から測った圧力 ${f(last,3)}、理論 Nm⟨v²⟩/(2V) ＝ ${f(pth,3)}（2次元）`, "--pos");
    ctx.ro(table([[`分子数 ${S("N")}・温度 ${S("T")}・体積（横幅）`, `${P.N}・${P.T} K・${f(P.W,2)}`], [`⟨${S("v")}²⟩（温度に比例）`, f(v2,4)], [`測定した圧力 ${S("p")}`, f(last,3)], [`${S("p")}${S("V")} ÷ (${S("N")}${S("T")})（一定になるか）`, last ? f(last*P.W/(P.N*P.T)*1e4,3) + " × 10⁻⁴" : "測定中…"]]));
    ctx.eqs(`<p class="eq">画面は2次元のモデル：${S("p")} ＝ ${S("N")}${S("m")}⟨${S("v")}²⟩/(2${S("V")})。3次元では ⟨${S("v")}<sub>x</sub>²⟩ ＝ ⟨${S("v")}²⟩/3 なので ${S("p")} ＝ ${S("N")}${S("m")}⟨${S("v")}²⟩/(3${S("V")})。</p><p class="eq">1回の衝突の力積 2${S("m")}${S("v")}<sub>x</sub> を、2 s 間・壁の長さあたりで平均したものを「測定した圧力」としている。</p>`);
  },
  asks:[
    ["温度を4倍（300 K → 1200 K）にしよう。分子の速さと圧力はそれぞれ何倍になるか。", "速さは 2 倍（√4）、圧力は 4 倍（T に比例）。"],
    ["箱の横幅（体積）を半分にしよう。圧力はどうなるか。それはなぜか。", "2 倍。1つの壁に当たる回数が2倍に増えるから（ボイルの法則）。"],
    ["速さの分布を見よう。全部の分子が同じ速さで動いているか。", "いろいろな速さの分子がある。温度が上がると分布が速いほうに広がる。"]
  ]
};

/* ---------- 1個の分子と壁・ピストンのエネルギーのやりとり（2次元モデル、m ＝ 1） ---------- */
const CG = 0.07;                                  // 速さの目盛り：1成分の標準偏差 ＝ CG√T
const kinE = q => 0.5*(q.vx*q.vx + q.vy*q.vy);    // 運動エネルギー（質量 1）
const toE = K => K/(CG*CG)*0.0138;                // ×10⁻²¹ J（2次元：平均運動エネルギー ＝ kT）
const toV = v => v/CG*Math.sqrt(Rg/0.028);        // m/s（窒素分子として）
const fromV = v => v*CG/Math.sqrt(Rg/0.028);
const sgn = x => (x >= 0 ? "＋" : "−") + f(Math.abs(x), 2);
function bars(cv, evs, title, avg){
  const {c:g, w:gw, h:gh} = prep(cv), ink2 = css("--ink2"), ink3 = css("--ink3");
  g.font = uiFont(12); g.fillStyle = ink2; g.textBaseline = "middle"; g.textAlign = "left"; g.fillText(title, 12, 10);
  const pl = 10, pr = 10, pt = 24, pb = 16, y0 = pt + (gh - pt - pb)/2, show = evs.slice(-24);
  const mx = Math.max(0.5, ...show.map(e => Math.abs(toE(e.dK))))*1.2, bw = (gw - pl - pr)/24;
  g.strokeStyle = css("--grid2"); g.lineWidth = 1; g.beginPath(); g.moveTo(pl, y0); g.lineTo(gw - pr, y0); g.stroke();
  show.forEach((e, i) => { const v = toE(e.dK), hh = v/mx*(gh - pt - pb)/2; g.fillStyle = v >= 0 ? css("--neg") : css("--pos"); g.fillRect(pl + i*bw + 1, hh >= 0 ? y0 - hh : y0, bw - 2, Math.abs(hh)); });
  if(evs.length){ const m = evs.reduce((a, e) => a + toE(e.dK), 0)/evs.length, Y = y0 - m/mx*(gh - pt - pb)/2; g.strokeStyle = css("--acc"); g.lineWidth = 2; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(pl, Y); g.lineTo(gw - pr, Y); g.stroke(); g.setLineDash([]); g.font = numFont(11); g.fillStyle = css("--acc"); g.textAlign = "right"; g.fillText(`${avg} ${m >= 0 ? "＋" : "−"}${f(Math.abs(m), 2)}`, gw - pr, gh - 5); }
  g.font = numFont(10); g.fillStyle = ink3; g.textAlign = "left"; g.fillText("古 → 新", pl, gh - 5);
}

/* ---------- 加熱（冷却）された壁に衝突する分子 ---------- */
const MU = 3, WOM = 100, RM = 0.022, RA = 0.07, WX = 0.62;   // 壁の原子の質量（分子の3倍）、ばねの角振動数、半径、壁の位置
const wall = {
  label:"壁との衝突（加熱・冷却）",
  params:[["Tg","分子のはじめの温度 "+S("T")+"<sub>気体</sub>",100,1200,10,"K",0,300],["Tw","壁の温度 "+S("T")+"<sub>壁</sub>",100,1200,10,"K",0,900]],
  toggles:[["trail","軌跡を表示",true]],
  timed:true, graphs:2, dt:1/240,
  legend:`<span><i style="background:var(--neg)"></i>運動エネルギーを得た</span><span><i style="background:var(--pos)"></i>失った</span><span><i style="background:var(--acc)"></i>平均</span>`,
  reset(P, St){
    const r = rng(777 + P.Tg), sa = CG*Math.sqrt(P.Tw/MU), v0 = Math.SQRT2*CG*Math.sqrt(P.Tg);
    St.r = r; St.m = {x:0.2, y:0.45, vx:v0*Math.cos(0.5), vy:v0*Math.sin(0.5)};
    St.at = []; for(let i = 0; i < 8; i++) St.at.push([WX, (i + 0.5)/8]); for(let i = 0; i <= 8; i++) St.at.push([WX + 0.108, i/8]);
    St.at = St.at.map(s => ({sx:s[0], sy:s[1], x:s[0] + sa/WOM*gauss(r), y:s[1] + sa/WOM*gauss(r), vx:sa*gauss(r), vy:sa*gauss(r)}));
    St.ev = []; St.pts = [[0, toE(kinE(St.m))]]; St.avg = [[0, toE(kinE(St.m))]]; St.sumK = 0; St.na = 0; St.trail = []; St.n = 0; St.lastHit = -9;
  },
  duration(){ return 60; },
  step(P, St, dt, t){
    const r = St.r, sa = CG*Math.sqrt(P.Tw/MU), gam = 3, q = St.m;
    const K0 = kinE(q); let hit = false;
    for(let k = 0; k < 4; k++){   // 分子は4回に分けて進め、すり抜けを防ぐ
      const h = dt/4;
      St.at.forEach(a => {
        a.vx += (-WOM*WOM*(a.x - a.sx) - gam*a.vx)*h + Math.sqrt(2*gam*h)*sa*gauss(r);
        a.vy += (-WOM*WOM*(a.y - a.sy) - gam*a.vy)*h + Math.sqrt(2*gam*h)*sa*gauss(r);
        a.x += a.vx*h; a.y += a.vy*h;
      });
      q.x += q.vx*h; q.y += q.vy*h;
      if(q.x < RM){ q.x = 2*RM - q.x; q.vx = -q.vx; }
      if(q.y < RM){ q.y = 2*RM - q.y; q.vy = -q.vy; }
      if(q.y > 1 - RM){ q.y = 2*(1 - RM) - q.y; q.vy = -q.vy; }
      for(let pass = 0; pass < 3; pass++) St.at.forEach(a => {
        const dx = q.x - a.x, dy = q.y - a.y, d = Math.hypot(dx, dy);
        if(d >= RM + RA || d < 1e-9) return;
        const nx = dx/d, ny = dy/d, vn = (q.vx - a.vx)*nx + (q.vy - a.vy)*ny;
        q.x = a.x + nx*(RM + RA); q.y = a.y + ny*(RM + RA);
        if(vn < 0){ const J = -2*vn/(1 + 1/MU); q.vx += J*nx; q.vy += J*ny; a.vx -= J/MU*nx; a.vy -= J/MU*ny; hit = true; }
      });
      if(q.x > WX - 0.03){ St.guard = (St.guard || 0) + 1; q.x = WX - 0.03 - (q.x - (WX - 0.03)); q.vx = -Math.abs(q.vx); hit = true; }   // 念のための安全策
    }
    const K1 = kinE(q);
    St.sumK += toE(K1)*dt; if(++St.na % 4 === 0) St.avg.push([t + dt, St.sumK/(t + dt)]);
    if(hit){
      const e = St.ev[St.ev.length - 1];
      if(e && t - St.lastHit < 0.06){ e.K1 = K1; e.dK = K1 - e.K0; e.t = t; } else St.ev.push({t, K0, K1, dK:K1 - K0, x:q.x, y:q.y});
      St.lastHit = t; St.pts.push([t, toE(K0)], [t, toE(K1)]);
    } else if(++St.n % 4 === 0) St.pts.push([t + dt, toE(K1)]);
    if(St.n % 3 === 0){ St.trail.push([q.x, q.y]); if(St.trail.length > 90) St.trail.shift(); }
  },
  draw(ctx){
    const {P, S:St, t, T} = ctx; const {c, w, h} = prep(ctx.stage);
    const tf = fit(w, h, {x0:-0.04, x1:WX + 0.3, y0:-0.12, y1:1.03}, 8), s = tf.s;
    const ink = css("--ink"), ink2 = css("--ink2"), q = St.m, K = kinE(q), wx = WX - 0.045;
    c.fillStyle = css("--surface2"); c.fillRect(tf.X(0), tf.Y(1), wx*s, s);
    c.fillStyle = heat(P.Tw); c.globalAlpha = 0.16; c.fillRect(tf.X(wx), tf.Y(1), 0.27*s, s); c.globalAlpha = 1;
    c.strokeStyle = ink2; c.lineWidth = 2.5; c.beginPath(); c.moveTo(tf.X(wx), tf.Y(1)); c.lineTo(tf.X(0), tf.Y(1)); c.lineTo(tf.X(0), tf.Y(0)); c.lineTo(tf.X(wx), tf.Y(0)); c.stroke();
    c.save(); c.beginPath(); c.rect(tf.X(wx - 0.05), tf.Y(1), 0.4*s, s); c.clip();
    St.at.forEach(a => { c.beginPath(); c.arc(tf.X(a.x), tf.Y(a.y), RA*s, 0, 7); c.fillStyle = heat(P.Tw); c.globalAlpha = 0.75; c.fill(); c.globalAlpha = 1; c.strokeStyle = ink2; c.lineWidth = 1.2; c.stroke(); });
    c.restore();
    if(T.trail && St.trail.length > 1){ c.strokeStyle = css("--acc"); c.globalAlpha = 0.5; c.lineWidth = 1.4; c.beginPath(); St.trail.forEach((p, i) => i ? c.lineTo(tf.X(p[0]), tf.Y(p[1])) : c.moveTo(tf.X(p[0]), tf.Y(p[1]))); c.stroke(); c.globalAlpha = 1; }
    const sp = Math.hypot(q.vx, q.vy);
    arrow(c, tf.X(q.x), tf.Y(q.y), tf.X(q.x) + q.vx*0.16*s, tf.Y(q.y) - q.vy*0.16*s, css("--vel"), 2.6);
    disc(c, tf.X(q.x), tf.Y(q.y), Math.max(5, RM*s), heat(K/(CG*CG)), ink);
    const ev = St.ev[St.ev.length - 1];
    if(ev && t - ev.t < 1.1){ const col = ev.dK >= 0 ? css("--neg") : css("--pos"); c.globalAlpha = Math.min(1, 1.6 - (t - ev.t)*1.2); label(c, `ΔK ＝ ${ev.dK >= 0 ? "＋" : "−"}${f(Math.abs(toE(ev.dK)), 2)}`, tf.X(WX - 0.08), tf.Y(Math.min(0.93, Math.max(0.07, ev.y))), col, "right", uiFont(13, true)); c.globalAlpha = 1; }
    label(c, `分子の K ＝ ${f(toE(K), 2)} ×10⁻²¹ J`, tf.X(0) + 8, tf.Y(1) + 14, ink, "left", uiFont(12, true));
    label(c, "断熱壁", tf.X(0), tf.Y(-0.06), ink2, "left", uiFont(11));
    label(c, `${P.Tw > P.Tg ? "加熱された壁" : P.Tw < P.Tg ? "冷却された壁" : "気体と同じ温度の壁"} ${P.Tw} K`, tf.X(WX + 0.3), tf.Y(-0.06), ink2, "right", uiFont(11, true));
    const n = St.ev.length, mean = n ? St.ev.reduce((a, e) => a + toE(e.dK), 0)/n : 0, Kw = toE(P.Tw*CG*CG), Kn = toE(K);
    const ymax = Math.max(Kw, toE(P.Tg*CG*CG), ...St.pts.map(p => p[1]))*1.25;
    graph(ctx.graphs[0], {title:"分子の K", unit:"×10⁻²¹ J", tmax:ctx.dur, t, ylo:0, yhi:ymax, series:[{pts:St.pts, color:"--pos", name:"K"}, {pts:St.avg, color:"--acc", name:"平均"}, {fn:() => Kw, color:"--neg", name:"壁の kT"}]});
    bars(ctx.graphs[1], St.ev, "衝突ごとの ΔK〔×10⁻²¹ J〕", "平均");
    ctx.banner(n ? `衝突 ${n} 回：K ＝ ${f(St.pts[0][1], 2)} → ${f(Kn, 2)}（×10⁻²¹ J）。1回ごとには増減するが、平均すると壁の温度に対応する値 ${f(Kw, 2)} に近づく。` : "分子が壁に衝突するのを待っています…", "--ui");
    const last = ev ? `${f(toE(ev.K0), 2)} → ${f(toE(ev.K1), 2)}（${sgn(toE(ev.dK))}）` : "—";
    ctx.ro(table([[`衝突の回数`, `${n} 回`], [`いまの ${S("K")}`, `${f(Kn, 2)} ×10⁻²¹ J`], [`壁の温度に対応する平均運動エネルギー ${S("k")}${S("T")}<sub>壁</sub>`, `${f(Kw, 2)} ×10⁻²¹ J`], [`最後の衝突の ${S("K")}（×10⁻²¹ J）`, last], [`衝突ごとの Δ${S("K")} の平均`, n ? `${sgn(mean)} ×10⁻²¹ J` : "—"]]));
    ctx.eqs(`<p class="eq">壁は固定されているが、壁をつくる原子は熱運動（振動）している。温度が高いほど激しく振動する。分子は壁の原子と弾性衝突し、運動エネルギーをやりとりする。</p><p class="eq">壁の原子が分子に向かってくるように動いていれば分子は加速され、遠ざかるように動いていれば減速される。壁が熱いと前者が多くなり、分子の運動エネルギーは平均として増える。これが「<b>熱の移動</b>」の分子レベルの姿である。</p><p class="eq">2次元モデルなので平均運動エネルギーは ${S("k")}${S("T")}（3次元では (3/2)${S("k")}${S("T")}）。窒素分子として換算している。</p>`);
  },
  asks:[
    ["気体 300 K、壁 900 K で再生しよう。分子の K はどう変わっていくか。1回ごとの ΔK はいつも正か。", "平均として増え、壁の kT に近づく。1回ごとの ΔK は正のこともあれば負のこともある（壁の原子が遠ざかる向きに動いていたとき）。"],

/* ---------- 等温変化：温度が違うと p-V 曲線の位置が変わる（面積 pV ＝ nRT） ---------- */
function gaxes(c, box, xmax, ymax, xlab, ylab, ink2, ink3, xs, ys){
  const X = v => box.x + v/xmax*box.w, Y = v => box.y + box.h - v/ymax*box.h;
  c.strokeStyle = ink2; c.lineWidth = 1.4; c.beginPath(); c.moveTo(X(0), Y(ymax)); c.lineTo(X(0), Y(0)); c.lineTo(X(xmax), Y(0)); c.stroke();
  label(c, ylab, X(0) + 4, Y(ymax) + 6, ink3, "left", uiFont(11)); label(c, xlab, X(xmax), Y(0) + 27, ink3, "right", uiFont(11));
  const sx = xs || LAB.niceStep(xmax, 5), sy = ys || LAB.niceStep(ymax, 4);
  c.font = numFont(10); c.fillStyle = ink3; c.textAlign = "center"; c.textBaseline = "alphabetic";
  for(let v = sx; v < xmax; v += sx) c.fillText(f(v, sx < 1 ? 1 : 0), X(v), Y(0) + 12);
  c.textAlign = "right"; for(let q = sy; q < ymax; q += sy) c.fillText(f(q, sy < 1 ? 1 : 0), X(0) - 3, Y(q) + 3);
  return {X, Y};
}
const pOf = (n, T, V) => n*Rg*T/(V*100);        // ×10⁵ Pa（V：×10⁻³ m³ ＝ L）
const vOf = (n, p, T) => n*Rg*T/(p*100);         // L
const niceCeil = x => { const st = x > 20 ? 5 : x > 8 ? 2 : x > 3 ? 1 : 0.5; return Math.ceil(x/st)*st; };
function curve(c, fn, x0, x1, ymax, X, Y, N){    // fn(x) が ymax を超える部分は描かない
  let on = false; c.beginPath();
  for(let i = 0; i <= N; i++){ const x = x0 + (x1 - x0)*i/N, y = fn(x); if(!(y <= ymax) || !isFinite(y)){ on = false; continue; } on ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y)); on = true; }
  c.stroke();
}
/* ---------- 縦型シリンダーと分子（ボイルの法則・シャルルの法則で共通） ---------- */
function partsInit(St, seed, N){ const r = rng(seed); St.ps = Array.from({length:N}, () => { const a = r()*2*Math.PI; return {x:r(), y:r(), dx:Math.cos(a), dy:Math.sin(a)}; }); St.hits = []; }
function partsStep(St, dt, t, sp, H){   // sp：速さ（シリンダーの幅 ＝ 1 として毎秒）、H：気体の高さ（幅との比）
  St.ps.forEach(q => { q.x += q.dx*sp*dt; q.y += q.dy*sp*dt/H;
    if(q.x < 0){ q.x = -q.x; q.dx = Math.abs(q.dx); } if(q.x > 1){ q.x = 2 - q.x; q.dx = -Math.abs(q.dx); }
    if(q.y < 0){ q.y = -q.y; q.dy = Math.abs(q.dy); } if(q.y > 1){ q.y = 2 - q.y; q.dy = -Math.abs(q.dy); St.hits.push(t); } });
  while(St.hits.length && St.hits[0] < t - 2) St.hits.shift();
}
const hitRate = (St, t) => t > 0.3 ? St.hits.length/Math.min(2, t) : 0;
function vcyl(c, o){   // o：x, y, w, h（シリンダーの外形）、frac（気体の高さ ÷ h）、tK、ps、bath、weight、heat、push
  const ink2 = css("--ink2"), bot = o.y + o.h, top = bot - o.h*o.frac, x = o.x, w = o.w;
  if(o.bath){ c.fillStyle = heat(o.tK); c.globalAlpha = 0.16; c.fillRect(x - 10, o.y + o.h*0.1, w + 20, o.h*0.9 + 10); c.globalAlpha = 1; }
  c.fillStyle = heat(o.tK); c.globalAlpha = 0.3; c.fillRect(x, top, w, bot - top); c.globalAlpha = 1;
  c.fillStyle = css("--ink"); c.globalAlpha = 0.75; o.ps.forEach(q => { c.beginPath(); c.arc(x + 4 + q.x*(w - 8), bot - 4 - q.y*Math.max(1, bot - top - 8), 2.5, 0, 7); c.fill(); }); c.globalAlpha = 1;
  c.strokeStyle = ink2; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, o.y); c.lineTo(x, bot); c.lineTo(x + w, bot); c.lineTo(x + w, o.y); c.stroke();
  c.fillStyle = ink2; c.fillRect(x + 2, top - 9, w - 4, 9);
  if(o.weight){ const ww = w*0.64, wh = 8 + o.weight*9; c.fillStyle = css("--ink3"); c.fillRect(x + (w - ww)/2, top - 9 - wh, ww, wh); if(wh > 14) label(c, "おもり", x + w/2, top - 9 - wh/2, css("--surface"), "center", uiFont(10, true)); }

  if(o.push){ const dn = o.push < 0; arrow(c, x + w + 13, dn ? top - 30 : top - 2, x + w + 13, dn ? top - 2 : top - 30, css("--acc"), 2.6); label(c, dn ? "押す" : "引く", x + w + 20, top - 16, css("--acc"), "left", uiFont(11, true)); }
  if(o.heat){ const cc = o.heat > 0 ? css("--neg") : css("--pos"); for(let k = 1; k <= 3; k++){ const xx = x + w*k/4; o.heat > 0 ? arrow(c, xx, bot + 20, xx, bot + 3, cc, 2.4) : arrow(c, xx, bot + 3, xx, bot + 20, cc, 2.4); } label(c, o.heat > 0 ? "加熱" : "冷却", x + w/2, bot + 30, cc, "center", uiFont(11, true)); }
  return {top, bot};
}

/* ---------- 共通：セルシウス目盛り・エネルギーの棒（Q ＝ ΔU ＋ W′） ---------- */
function celsius(c, ax, ink3){ c.font = numFont(10); c.fillStyle = ink3; c.textAlign = "center"; c.textBaseline = "alphabetic";
  [[0, "−273 ℃"], [273, "0 ℃"], [473, "200 ℃"]].forEach(([k, s2]) => { c.fillText(s2, ax.X(k), ax.Y(0) + 40); c.strokeStyle = ink3; c.lineWidth = 1; c.beginPath(); c.moveTo(ax.X(k), ax.Y(0)); c.lineTo(ax.X(k), ax.Y(0) + 4); c.stroke(); }); }
function energyBars(c, b, Q, dU, Wp, lo, hi, big){
  // b：{x, y, w, h}。左の柱 ＝ Q、右の柱 ＝ ΔU の上に W′ を積む（終わりの高さが Q と一致する）
  const ink2 = css("--ink2"), ink3 = css("--ink3"), neg = css("--neg"), hl2 = css("--hl2"), acc = css("--acc");
  const top = b.y + 46, bt = b.y + b.h - (big ? 58 : 50), Y = v => bt - (v - lo)/(hi - lo)*(bt - top), y0 = Y(0);
  const cw = Math.min(70, b.w*0.24), x1 = b.x + b.w*0.16, x2 = b.x + b.w*0.6;
  label(c, "Q ＝ ΔU ＋ W′", b.x + b.w/2, b.y + 10, ink2, "center", uiFont(big ? 15 : 13, true));
  c.strokeStyle = ink3; c.lineWidth = 1.2; c.beginPath(); c.moveTo(b.x + 4, y0); c.lineTo(b.x + b.w - 4, y0); c.stroke();
  label(c, "0", b.x + 2, y0 - 7, ink3, "left", numFont(10));
  const bar = (x, v0, v1, col) => { if(Math.abs(Y(v1) - Y(v0)) < 0.5) return; c.fillStyle = col; c.globalAlpha = 0.85; c.fillRect(x, Math.min(Y(v0), Y(v1)), cw, Math.abs(Y(v1) - Y(v0))); c.globalAlpha = 1; };
  // 右は「滝」の形：ΔU の柱の終わりから W′ の柱を始める（W′ の柱の終わりが Q の高さ）
  const hw = cw*0.62, x3 = x2 + hw + 4;
  bar(x1, 0, Q, neg);
  const bar2 = (x, v0, v1, col) => { if(Math.abs(Y(v1) - Y(v0)) < 0.5) return; c.fillStyle = col; c.globalAlpha = 0.85; c.fillRect(x, Math.min(Y(v0), Y(v1)), hw, Math.abs(Y(v1) - Y(v0))); c.globalAlpha = 1; };
  bar2(x2, 0, dU, hl2); bar2(x3, dU, dU + Wp, acc);
  c.strokeStyle = ink3; c.setLineDash([2, 3]); c.lineWidth = 1; c.beginPath(); c.moveTo(x2, Y(dU)); c.lineTo(x3 + hw, Y(dU)); c.stroke();
  c.strokeStyle = ink2; c.setLineDash([4, 3]); c.lineWidth = 1.2; c.beginPath(); c.moveTo(x1, Y(Q)); c.lineTo(x3 + hw, Y(Q)); c.stroke(); c.setLineDash([]);
  label(c, "Q", x1 + cw/2, b.y + 31, neg, "center", uiFont(13, true)); label(c, "ΔU", x2 + hw/2, b.y + 31, hl2, "center", uiFont(13, true)); label(c, "＋ W′", x3 + hw/2, b.y + 31, acc, "center", uiFont(13, true));
  const sg = v => (v > 0.5 ? "＋" : v < -0.5 ? "−" : "") + f(Math.abs(v), 0);
  const fs = uiFont(big ? 13 : 12, true), yy = b.y + b.h - (big ? 40 : 34);
  label(c, `Q ${sg(Q)} J`, x1 + cw/2, yy, neg, "center", fs);
  label(c, `ΔU ${sg(dU)} J`, x2 + hw + 2, yy, hl2, "center", fs);
  label(c, `W′ ${sg(Wp)} J`, x2 + hw + 2, yy + 16, acc, "center", fs);
}
function addStops(c, x, w, y, ink2){ c.fillStyle = ink2; [[x, 1], [x + w, -1]].forEach(([xx, d]) => { c.beginPath(); c.moveTo(xx, y); c.lineTo(xx + 9*d, y); c.lineTo(xx, y - 7); c.closePath(); c.fill(); }); }

function molarAt(P, t){

  return {Ph, Qv:qv, Qp:qp, Tv, Tp, Vp:24.9*Tp/300, hv:q < Qv, hp:q < Qp};
}

  else if(P.proc === "T"){ V2 = P.V2; p2 = p1*V1/V2; }
  else { V2 = P.V2; p2 = p1*Math.pow(V1/V2, gam); }

    if(P.proc === "v") return [V1, p1 + (p2 - p1)*s];

    if(P.proc === "p") return [Vv, p1];
    if(P.proc === "T") return [Vv, p1*V1/Vv];
    return [Vv, p1*Math.pow(V1/Vv, gam)];
  };

  const Wp = (P.proc === "v") ? 0 : (P.proc === "p") ? p1*(V2 - V1)*100 : (P.proc === "T") ? p1*V1*Math.log(V2/V1)*100 : 1.5*(p1*V1 - p2*V2)*100;

      if(P.proc === "p"){ const Te = Math.min(Tmax, 300*vmax/D.V1); g.strokeStyle = ink3; g.globalAlpha = 0.5; g.setLineDash([4, 4]); g.lineWidth = 1.2; g.beginPath(); g.moveTo(tx.X(0), tx.Y(0)); g.lineTo(tx.X(Te), tx.Y(Te*D.V1/300)); g.stroke(); g.setLineDash([]); g.globalAlpha = 1; }
      g.strokeStyle = pos; g.globalAlpha = 0.3; g.lineWidth = 2; g.beginPath(); for(let i = 0; i <= 80; i++){ const q = D.at(i/80); i ? g.lineTo(tx.X(Tof(q)), tx.Y(q[0])) : g.moveTo(tx.X(Tof(q)), tx.Y(q[0])); } g.stroke(); g.globalAlpha = 1;
      g.lineWidth = 3; g.beginPath(); for(let i = 0; i <= 80; i++){ const q = D.at(s*i/80); i ? g.lineTo(tx.X(Tof(q)), tx.Y(q[0])) : g.moveTo(tx.X(Tof(q)), tx.Y(q[0])); } g.stroke();
      disc(g, tx.X(Tof(cur)), tx.Y(cur[0]), 6, pos);
      label(g, "1", tx.X(300) - 8, tx.Y(D.V1) - 8, ink2, "right", uiFont(12, true)); label(g, "2", tx.X(Tof([D.V2, D.p2])) + 8, tx.Y(D.V2) - 8, ink2, "left", uiFont(12, true));
      label(g, {v:"定積：T が変わっても V は一定（水平な線）", p:"定圧：原点を通る直線（V ∝ T）", T:"等温：T 一定（縦の線）", a:"断熱：T V^(2/3) ＝ 一定"}[P.proc], gw - 8, 10, ink3, "right", numFont(10)); }
    ctx.banner(`${PROC[P.proc]}：Q ＝ ΔU ＋ W′ → ${f(D.Qh,0)} ＝ ${f(D.dU,0)} ＋ ${f(D.Wp,0)}〔J〕`, "--ui");
    ctx.ro(table([[`物質量 ${S("n")}（${S("p")}₁${S("V")}₁ ＝ ${S("n")}${S("R")} × 300）`, `${f(D.n,3)} mol`], [`状態1 → 2：${S("p")}〔×10⁵ Pa〕`, `${f(D.p1,3)} → ${f(D.p2,3)}`], [`${S("V")}〔×10⁻³ m³〕`, `${f(D.V1,2)} → ${f(D.V2,2)}`], [`${S("T")}〔K〕`, `300 → ${f(D.T2,1)}`],
      [`気体がした仕事 ${S("W")}′（面積）`, `${f(D.Wp,1)} J`], [`内部エネルギーの増加 Δ${S("U")} ＝ (3/2)Δ(${S("p")}${S("V")})`, `${f(D.dU,1)} J`], [`吸収した熱量 ${S("Q")}`, `${f(D.Qh,1)} J`]]));
    const ex = {v:`${S("W")}′ ＝ 0 → ${S("Q")} ＝ Δ${S("U")}`, p:`${S("W")}′ ＝ ${S("p")}Δ${S("V")} ＝ ${S("n")}${S("R")}Δ${S("T")}、${S("Q")} ＝ (5/2)${S("n")}${S("R")}Δ${S("T")}`, T:`Δ${S("U")} ＝ 0、<span class="tag c">微積</span>${S("W")}′ ＝ ∫${S("p")}d${S("V")} ＝ ${S("n")}${S("R")}${S("T")} log<sub>e</sub>(${S("V")}₂/${S("V")}₁)`, a:`${S("Q")} ＝ 0、${S("p")}${S("V")}<sup>5/3</sup> ＝ 一定、${S("W")}′ ＝ −Δ${S("U")}`}[P.proc];
    ctx.eqs(`<p class="eq">${ex}</p><p class="eq">点線は 300 K と終わりの温度の等温線（${S("p")}${S("V")} ＝ 一定）。</p>`);
  },
  asks:[
    ["同じ体積だけ膨張させるとき、等温と断熱で終わりの圧力・温度を比べよう。", "断熱のほうが圧力の下がり方が急で、温度が下がる（外への仕事を内部エネルギーでまかなうから）。"],
    ["定圧変化で、Q・ΔU・W′ の比はいくらか。", "5 : 3 : 2。"],
    ["圧縮（V₂ ＜ V₁）にすると、面積の色と W′ の符号はどうなるか。", "W′ が負（外から仕事をされる）。"],
    ["V-T 図で、定圧変化・等温変化・定積変化はそれぞれどんな線か。", "定圧は原点を通る直線（V ∝ T）、等温は縦の線（T 一定）、定積は水平な線（V 一定）。"],
    ["膨張させたとき、等温と断熱で V-T 図の線はどう違うか。", "等温は縦の線（T 一定で V が増える）、断熱は V が増えるとき T が下がる左上がりの曲線（V ∝ T^(−3/2)）。"]
  ]
};
