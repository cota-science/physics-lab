<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>円運動ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="lab.css">
<script src="lab-common.js"></script>
</head>
<body>
<script>
(function(){
"use strict";
const {f, S, V, css, prep, arrow, label, symFont, uiFont, numFont, fit, disc, table, graph} = LAB;
const G = 9.8, PI2 = Math.PI*2;

/* ---------- 等速円運動 ---------- */
const uniform = {
  label:"等速円運動のベクトル",
  params:[["r","半径 "+S("r"),0.5,2,0.05,"m",2,1],["w","角速度 "+S("ω"),0.5,4,0.1,"rad/s",1,1.5]],
  toggles:[["vel","速度",true],["acc","加速度",true],["hodo","速度を1点から並べる（右上）",true]],
  timed:true, graphs:3,
  legend:`<span><i style="background:var(--pos)"></i>位置</span><span><i style="background:var(--vel)"></i>速度 ${V("v")}</span><span><i style="background:var(--acc)"></i>加速度 ${V("a")}</span>`,
  reset(){}, duration(P){ return 2*PI2/P.w; }, step(){},
  draw(ctx){
    const {P, t, T} = ctx; const {c, w, h} = prep(ctx.stage);
    const ph = P.w*t, x = P.r*Math.cos(ph), y = P.r*Math.sin(ph), vmag = P.r*P.w, amag = P.r*P.w*P.w;
    const wide = w > h*1.25;
    const tf = fit(w, h, wide ? {x0:-2.3, x1:4.6, y0:-2.3, y1:2.3} : {x0:-2.3, x1:2.3, y0:-2.3, y1:2.3});
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), acc = css("--acc");
    c.strokeStyle = ink3; c.setLineDash([5,4]); c.beginPath(); c.arc(tf.X(0), tf.Y(0), P.r*tf.s, 0, PI2); c.stroke(); c.setLineDash([]);
    disc(c, tf.X(0), tf.Y(0), 3.5, ink2); label(c, "O", tf.X(0)-10, tf.Y(0)+10, ink2);
    c.strokeStyle = pos; c.lineWidth = 1.5; c.beginPath(); c.moveTo(tf.X(0), tf.Y(0)); c.lineTo(tf.X(x), tf.Y(y)); c.stroke();
    label(c, "r", tf.X(x/2) + 6, tf.Y(y/2) - 6, pos, "left", symFont(14, true));
    const kv = 0.9/Math.max(vmag, 0.5), ka = 0.9/Math.max(amag, 0.5);
    if(T.vel){ arrow(c, tf.X(x), tf.Y(y), tf.X(x - P.w*y*kv*P.r/P.r), tf.Y(y + P.w*x*kv), vel, 3); label(c, "v", tf.X(x - P.w*y*kv) + 6, tf.Y(y + P.w*x*kv) - 6, vel, "left", symFont(15, true)); }
    if(T.acc){ arrow(c, tf.X(x), tf.Y(y), tf.X(x - P.w*P.w*x*ka), tf.Y(y - P.w*P.w*y*ka), acc, 3); label(c, "a", tf.X(x - P.w*P.w*x*ka*0.6) + 8, tf.Y(y - P.w*P.w*y*ka*0.6) + 8, acc, "left", symFont(15, true)); }
    disc(c, tf.X(x), tf.Y(y), 9, pos);
    // hodograph: velocities drawn from one point
    if(T.hodo){
      const cx = wide ? 3.3 : 1.3, cy = wide ? 0 : 1.3, R = wide ? 1.0 : 0.75, k = R/vmag;
      c.fillStyle = css("--surface"); c.globalAlpha = wide ? 0 : 0.9; c.fillRect(tf.X(cx - R - 0.25), tf.Y(cy + R + 0.4), (2*R + 0.5)*tf.s, (2*R + 0.6)*tf.s); c.globalAlpha = 1;
      label(c, "速度を1点から並べる", tf.X(cx), tf.Y(cy + R + 0.25), ink2, "center", uiFont(11));
      c.strokeStyle = vel; c.globalAlpha = 0.35; c.setLineDash([4,4]); c.beginPath(); c.arc(tf.X(cx), tf.Y(cy), R*tf.s, 0, PI2); c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
      const dth = 0.5;
      for(let s = ph - 3*dth; s <= ph + 1e-9; s += dth){
        const vx = -Math.sin(s)*R, vy = Math.cos(s)*R;
        arrow(c, tf.X(cx), tf.Y(cy), tf.X(cx + vx), tf.Y(cy + vy), vel, Math.abs(s - ph) < 1e-6 ? 2.6 : 1.2);
      }
      const ax = -Math.cos(ph)*R*0.6, ay = -Math.sin(ph)*R*0.6, tipx = cx - Math.sin(ph)*R, tipy = cy + Math.cos(ph)*R;
      if(T.acc){ arrow(c, tf.X(tipx), tf.Y(tipy), tf.X(tipx + ax), tf.Y(tipy + ay), acc, 2.4); label(c, "Δv", tf.X(tipx + ax) + 4, tf.Y(tipy + ay), acc, "left", symFont(13, true)); }
    }
    ctx.banner(`加速度は中心向き：大きさ rω² ＝ ${f(amag,2)} m/s²（速さ ${f(vmag,2)} m/s は一定）`, "--acc");
    const D = ctx.dur;
    graph(ctx.graphs[0], {title:"x-t", unit:"m", tmax:D, t, series:[{fn:s => P.r*Math.cos(P.w*s), color:"--pos"}]});
    graph(ctx.graphs[1], {title:"vx-t（x を微分）", unit:"m/s", tmax:D, t, series:[{fn:s => -P.r*P.w*Math.sin(P.w*s), color:"--vel"}]});
    graph(ctx.graphs[2], {title:"ax-t（＝ −ω²x）", unit:"m/s²", tmax:D, t, series:[{fn:s => -P.r*P.w*P.w*Math.cos(P.w*s), color:"--acc"}]});
    ctx.ro(table([[`周期 ${S("T")} ＝ 2π/${S("ω")}`, `${f(PI2/P.w,3)} s`], [`速さ ${S("v")} ＝ ${S("r")}${S("ω")}`, `${f(vmag,3)} m/s`], [`加速度 ${S("a")} ＝ ${S("r")}${S("ω")}² ＝ ${S("v")}²/${S("r")}`, `${f(amag,3)} m/s²`], [`位置 (${S("x")}, ${S("y")})`, `(${f(x,2)}, ${f(y,2)}) m`]]));
    ctx.eqs(`<p class="eq"><span class="tag c">微積</span>${S("x")} ＝ ${S("r")} cos ${S("ω")}${S("t")} → ${S("v")}<sub>x</sub> ＝ −${S("r")}${S("ω")} sin ${S("ω")}${S("t")} → ${S("a")}<sub>x</sub> ＝ −${S("r")}${S("ω")}² cos ${S("ω")}${S("t")} ＝ −${S("ω")}²${S("x")}</p>
      <p class="eq"><span class="tag n">微積なし</span>速度の先端は半径 ${S("v")} の円を角速度 ${S("ω")} で回る → 加速度 ＝ ${S("v")}${S("ω")} ＝ ${S("v")}²/${S("r")}</p>`);
  },
  asks:[
    ["右上の図で、Δv（緑）はどちらを向いているか。左の図の加速度と比べよう。", "円の中心向き。速度ベクトルの先端が回るときの「速度の速度」が加速度。"],
    ["ω を2倍にすると、速さと加速度はそれぞれ何倍になるか。", "速さ rω は2倍、加速度 rω² は4倍。"],
    ["x-t と ax-t のグラフを比べよう。どんな関係があるか。", "ax ＝ −ω²x（形が上下逆）。単振動（単元5）と同じ関係。"]
  ]
};

/* ---------- 円すい振り子 ---------- */
const conical = {
  label:"円すい振り子（2つの立場）",
  params:[["L","糸の長さ "+S("L"),0.3,2,0.05,"m",2,1],["th","鉛直とのなす角 "+S("θ"),5,80,1,"°",0,60],["m","質量 "+S("m"),0.05,1,0.05,"kg",2,0.2]],
  toggles:[["rot","回転する人から見る（遠心力）",false],["sum","合力（向心力）",true]],
  timed:true, graphs:0, aspect:"16/9",
  legend:`<span><i style="background:var(--vel)"></i>張力 ${S("S")}</span><span><i style="background:var(--acc)"></i>重力 ${S("m")}${S("g")}</span><span><i style="background:var(--hl2)"></i>合力 ＝ 向心力 または 遠心力</span>`,
  reset(){}, duration(P){ const th = P.th*Math.PI/180; return 3*PI2*Math.sqrt(P.L*Math.cos(th)/G); }, step(){},
  draw(ctx){
    const {P, t, T} = ctx; const {c, w, h} = prep(ctx.stage);
    const th = P.th*Math.PI/180, r = P.L*Math.sin(th), hh = P.L*Math.cos(th), om = Math.sqrt(G/hh), Sx = P.m*G/Math.cos(th);
    const ph = T.rot ? 0 : om*t;   // 回転する立場では小球は止まって見える
    const ext = Math.max(r + 0.3*P.L, 0.5*P.L); const tf = fit(w, h, {x0:-ext, x1:ext, y0:-(hh + 0.38*P.L), y1:0.12*P.L});
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), acc = css("--acc"), hl2 = css("--hl2");
    const sq = 0.25, bx = r*Math.cos(ph), bz = r*Math.sin(ph), sx = tf.X(bx), sy = tf.Y(-hh + sq*bz);
    c.strokeStyle = ink2; c.lineWidth = 3; c.beginPath(); c.moveTo(tf.X(-0.4), tf.Y(0)); c.lineTo(tf.X(0.4), tf.Y(0)); c.stroke();
    c.strokeStyle = ink3; c.lineWidth = 1; c.setLineDash([4,4]); c.beginPath(); c.moveTo(tf.X(0), tf.Y(0)); c.lineTo(tf.X(0), tf.Y(-hh - 0.3)); c.stroke();
    c.beginPath(); c.ellipse(tf.X(0), tf.Y(-hh), r*tf.s, sq*r*tf.s, 0, 0, PI2); c.stroke(); c.setLineDash([]);
    c.strokeStyle = ink2; c.lineWidth = 1.6; c.beginPath(); c.moveTo(tf.X(0), tf.Y(0)); c.lineTo(sx, sy); c.stroke();
    // forces (scaled by mg)
    const k = 0.3*P.L/(P.m*G);
    const ux = -bx/P.L, uy = (hh - sq*bz*0)/P.L;     // string direction toward pivot (projected)
    arrow(c, sx, sy, sx + (-bx)/P.L*Sx*k*tf.s, sy - hh/P.L*Sx*k*tf.s, vel, 2.8);
    label(c, "S", sx + (-bx)/P.L*Sx*k*tf.s - 8, sy - hh/P.L*Sx*k*tf.s - 4, vel, "right", symFont(15, true));
    arrow(c, sx, sy, sx, sy + P.m*G*k*tf.s, acc, 2.8); label(c, "mg", sx + 6, sy + P.m*G*k*tf.s, acc, "left", symFont(14, true));
    const Fc = P.m*r*om*om;
    if(T.sum && !T.rot){ arrow(c, sx, sy, sx - bx/r*Fc*k*tf.s, sy, hl2, 2.6, [6,3]); label(c, "合力（向心力）", sx - bx/r*Fc*k*tf.s/2, sy + 14, hl2, "center", uiFont(12)); }
    if(T.rot){ arrow(c, sx, sy, sx + bx/r*Fc*k*tf.s, sy, hl2, 2.8); label(c, "遠心力 mrω²", sx + bx/r*Fc*k*tf.s, sy - 12, hl2, "center", uiFont(12)); }
    disc(c, sx, sy, 9, pos);
    label(c, "θ", tf.X(0.12), tf.Y(-0.32), ink2, "left", symFont(14));
    ctx.banner(T.rot ? "回転する人から見る：小球は静止。張力・重力・遠心力がつり合う" : "地面から見る：張力と重力の合力（水平・中心向き）が向心力として円運動させる", T.rot ? "--hl2" : "--ui");
    ctx.ro(table([[`半径 ${S("r")} ＝ ${S("L")} sin ${S("θ")}`, `${f(r,3)} m`], [`高さ ${S("h")} ＝ ${S("L")} cos ${S("θ")}`, `${f(hh,3)} m`], [`張力 ${S("S")} ＝ ${S("m")}${S("g")}/cos ${S("θ")}`, `${f(Sx,3)} N`],
      [`角速度 ${S("ω")} ＝ √(${S("g")}/${S("h")})`, `${f(om,3)} rad/s`], [`周期 2π√(${S("h")}/${S("g")})`, `${f(PI2/om,3)} s`], [`向心力 ${S("m")}${S("r")}${S("ω")}² ＝ ${S("m")}${S("g")} tan ${S("θ")}`, `${f(Fc,3)} N`]]));
    ctx.eqs(`<p class="eq">鉛直：${S("S")} cos ${S("θ")} ＝ ${S("m")}${S("g")}　水平：${S("S")} sin ${S("θ")} ＝ ${S("m")}${S("r")}${S("ω")}²${T.rot ? "（回転する人から見ると、遠心力とのつり合い）" : "（地面から見た運動方程式）"}</p>`);
  },
  asks:[
    ["「回転する人から見る」を切りかえよう。水平方向の式はどちらの立場でも同じになるか。", "同じ（S sin θ ＝ mrω²）。地面からは運動方程式、回転する人からは遠心力とのつり合い。"],
    ["糸の長さを変えずに θ を大きくしよう。周期はどうなるか。", "短くなる。周期 2π√(h/g) は高さ h ＝ L cos θ だけで決まる。"],
    ["質量を変えると周期は変わるか。", "変わらない。張力も向心力も m に比例するので約分される。"]
  ]
};

/* ---------- 鉛直面内の円運動 ---------- */
const vertical = {
  label:"鉛直面内の円運動",
  params:[["r","糸の長さ "+S("r"),0.3,1.5,0.05,"m",2,0.4],["v0","最下点での速さ "+S("v")+"<sub>0</sub>",1,8,0.01,"m/s",2,4.43],["m","質量 "+S("m"),0.05,1,0.05,"kg",2,0.1]],
  timed:true, graphs:2, dt:1/1000,
  legend:`<span><i style="background:var(--vel)"></i>張力 ${S("S")}</span><span><i style="background:var(--acc)"></i>重力</span><span><i style="background:var(--pos)"></i>小球</span>`,
  reset(P, St){ St.mode = "circle"; St.th = 0; St.om = P.v0/P.r; St.x = 0; St.y = -P.r; St.vx = P.v0; St.vy = 0; St.trace = []; St.ts = []; St.last = -1; St.minS = Infinity; St.slackAt = null; },
  duration(){ return 4; },
  step(P, St, dt, t){
    if(St.mode === "circle"){
      // θ は最下点から反時計回り
      const al = -G/P.r*Math.sin(St.th);
      St.om += al*dt; St.th += St.om*dt;
      St.x = P.r*Math.sin(St.th); St.y = -P.r*Math.cos(St.th);
      const v = P.r*St.om; St.vx = v*Math.cos(St.th); St.vy = v*Math.sin(St.th);
      St.S = P.m*v*v/P.r + P.m*G*Math.cos(St.th);
      if(St.S < 0){ St.mode = "free"; St.slackAt = {t, th:St.th, x:St.x, y:St.y}; St.S = 0; }
    } else if(St.mode === "free"){
      St.vy -= G*dt; St.x += St.vx*dt; St.y += St.vy*dt; St.S = 0;
      if(Math.hypot(St.x, St.y) >= P.r*0.999 && t - St.slackAt.t > 0.05){ St.mode = "taut"; }
    }
    if(St.mode !== "taut" && t - St.last >= 0.01){ St.ts.push([t, St.S || 0, Math.hypot(St.vx, St.vy)]); St.trace.push([St.x, St.y]); St.last = t; }
  },
  draw(ctx){
    const {P, S:St, t} = ctx; const {c, w, h} = prep(ctx.stage);
    const tf = fit(w, h, {x0:-1.4*P.r - 0.3, x1:1.4*P.r + 0.3, y0:-1.3*P.r - 0.3, y1:1.3*P.r + 0.2});
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), acc = css("--acc");
    c.strokeStyle = ink3; c.setLineDash([5,4]); c.beginPath(); c.arc(tf.X(0), tf.Y(0), P.r*tf.s, 0, PI2); c.stroke(); c.setLineDash([]);
    disc(c, tf.X(0), tf.Y(0), 4, ink2);
    c.strokeStyle = pos; c.globalAlpha = 0.4; c.lineWidth = 1.5; c.beginPath(); St.trace.forEach((p, i) => i ? c.lineTo(tf.X(p[0]), tf.Y(p[1])) : c.moveTo(tf.X(p[0]), tf.Y(p[1]))); c.stroke(); c.globalAlpha = 1;
    const bx = tf.X(St.x), by = tf.Y(St.y), slack = St.mode !== "circle";
    c.strokeStyle = ink2; c.lineWidth = 1.6; c.setLineDash(slack ? [3,4] : []);
    c.beginPath(); c.moveTo(tf.X(0), tf.Y(0));
    if(slack){ const mx = (St.x)/2, my = (St.y)/2 - 0.15*P.r; c.quadraticCurveTo(tf.X(mx), tf.Y(my), bx, by); } else c.lineTo(bx, by);
    c.stroke(); c.setLineDash([]);
    const k = 0.6*P.r/(P.m*G)*tf.s/3;
    if(!slack && St.S > 0){ const d = Math.hypot(St.x, St.y); arrow(c, bx, by, bx - St.x/d*St.S*k, by + St.y/d*St.S*k, vel, 2.8); label(c, `S ${f(St.S,2)} N`, bx - St.x/d*St.S*k + 6, by + St.y/d*St.S*k - 8, vel, "left", numFont(11)); }
    arrow(c, bx, by, bx, by + P.m*G*k, acc, 2.4);
    disc(c, bx, by, 9, pos);
    const vmin = Math.sqrt(5*G*P.r);
    if(St.mode === "circle") ctx.banner(P.v0 >= vmin - 1e-9 ? `1周できる（v₀ ≧ √(5gr) ＝ ${f(vmin,2)} m/s）` : `v₀ ＜ √(5gr) ＝ ${f(vmin,2)} m/s：どこかで糸がたるむ、または上がりきらない`, P.v0 >= vmin - 1e-9 ? "--acc" : "--ink2");
    else ctx.banner(`糸がたるんだ（張力 0）：最下点から ${f(St.slackAt.th*180/Math.PI,0)}° の位置。そのあとは放物運動${St.mode === "taut" ? "。糸が再び張ったところで計算を止めた" : ""}`, "--neg");
    const D = ctx.dur;
    graph(ctx.graphs[0], {title:"張力 S-t", unit:"N", tmax:D, t, series:[{pts:St.ts.map(p => [p[0], p[1]]), color:"--vel"}]});
    graph(ctx.graphs[1], {title:"速さ v-t", unit:"m/s", tmax:D, t, ylo:0, yhi:P.v0*1.1, series:[{pts:St.ts.map(p => [p[0], p[2]]), color:"--pos"}]});
    const vtop2 = P.v0*P.v0 - 4*G*P.r;
    ctx.ro(table([[`最下点の張力 ${S("m")}${S("g")} ＋ ${S("m")}${S("v")}<sub>0</sub>²/${S("r")}`, `${f(P.m*G + P.m*P.v0*P.v0/P.r,3)} N`],
      [`糸が水平の位置の張力`, P.v0*P.v0 - 2*G*P.r >= 0 ? `${f(P.m*(P.v0*P.v0 - 2*G*P.r)/P.r,3)} N` : "届かない"],
      [`最高点の速さ（届くなら）`, vtop2 >= 0 ? `${f(Math.sqrt(vtop2),3)} m/s` : "届かない"], [`最高点の張力`, vtop2 >= 0 ? `${f(P.m*vtop2/P.r - P.m*G,3)} N` : "—"], [`1周に必要な最小の ${S("v")}<sub>0</sub> ＝ √(5${S("g")}${S("r")})`, `${f(vmin,3)} m/s`]]));
    ctx.eqs(`<p class="eq">速さ（エネルギー保存）：${S("v")}² ＝ ${S("v")}<sub>0</sub>² − 2${S("g")}${S("r")}(1 − cos ${S("θ")})</p><p class="eq">中心方向：${S("S")} − ${S("m")}${S("g")} cos ${S("θ")} ＝ ${S("m")}${S("v")}²/${S("r")}（${S("θ")}：最下点からの角）　→ ${S("S")} ＜ 0 になったら糸がたるむ</p>`);
  },
  asks:[
    ["v₀ ＝ √(5gr) ちょうど（r ＝ 0.40 m なら 4.43 m/s）で回そう。最高点の張力は？", "0。最高点では重力だけで向心力をまかなっている（v ＝ √(gr)）。"],
    ["v₀ を 4.0 m/s に下げよう。どこで、どうなるか。", "糸が水平より上の位置で張力が 0 になり、糸がたるんで放物運動になる。"],
    ["張力のグラフで、最下点の張力は最高点の張力より何 N 大きいか（1周するとき）。", "6mg 大きい（v₀ によらない）。"]
  ]
};

LAB.app({title:"円運動ラボ", modes:{uniform, conical, vertical}});
})();
</script>
</body>
</html>
