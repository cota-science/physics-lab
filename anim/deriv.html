<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>速度・加速度の定義ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="lab.css">
<script src="lab-common.js"></script>
</head>
<body>
<script>
(function(){
"use strict";
const {f, S, V, css, prep, arrow, label, symFont, uiFont, numFont, disc, table, graph} = LAB;
const {sin, cos, PI, hypot, atan2, abs} = Math;

/* ---------- 運動の例（位置・速度・加速度を式で持つ） ---------- */
const W8 = 0.7, WC = 0.8, RC = 2;
const PATHS = {
  eight:{name:"一般の曲線（8の字）", T:2*PI/W8, periodic:true,
    r:t => [3 + 2.4*sin(W8*t), 2 + 1.4*sin(2*W8*t)],
    v:t => [2.4*W8*cos(W8*t), 2.8*W8*cos(2*W8*t)],
    a:t => [-2.4*W8*W8*sin(W8*t), -5.6*W8*W8*sin(2*W8*t)]},
  circle:{name:"等速円運動", T:2*PI/WC, periodic:true,
    r:t => [2.6 + RC*cos(WC*t), 2.4 + RC*sin(WC*t)],
    v:t => [-RC*WC*sin(WC*t), RC*WC*cos(WC*t)],
    a:t => [-RC*WC*WC*cos(WC*t), -RC*WC*WC*sin(WC*t)]},
  throw:{name:"放物運動", T:7/4.9, periodic:false,
    r:t => [4*t, 7*t - 4.9*t*t],
    v:t => [4, 7 - 9.8*t],
    a:() => [0, -9.8]}
};
const PATH_OPTS = [["eight","一般の曲線（8の字）"],["circle","等速円運動"],["throw","放物運動"]];
/* 曲線全体の範囲と、速さ・加速度の最大値（矢印の倍率に使う） */
function stats(pa){
  if(pa._s) return pa._s;
  let x0 = 0, x1 = 0, y0 = 0, y1 = 0, px0 = 1e9, px1 = -1e9, py0 = 1e9, py1 = -1e9, vx0 = 0, vx1 = 0, vy0 = 0, vy1 = 0, vm = 0, am = 0;
  for(let i = 0; i <= 400; i++){
    const t = pa.T*i/400, r = pa.r(t), v = pa.v(t), a = pa.a(t);
    px0 = Math.min(px0, r[0]); px1 = Math.max(px1, r[0]); py0 = Math.min(py0, r[1]); py1 = Math.max(py1, r[1]);
    x0 = Math.min(x0, r[0]); x1 = Math.max(x1, r[0]); y0 = Math.min(y0, r[1]); y1 = Math.max(y1, r[1]);
    vx0 = Math.min(vx0, v[0]); vx1 = Math.max(vx1, v[0]); vy0 = Math.min(vy0, v[1]); vy1 = Math.max(vy1, v[1]);
    vm = Math.max(vm, hypot(v[0], v[1])); am = Math.max(am, hypot(a[0], a[1]));
  }
  return pa._s = {b:{x0, x1, y0, y1}, pb:{x0:px0, x1:px1, y0:py0, y1:py1}, vb:{x0:vx0, x1:vx1, y0:vy0, y1:vy1}, vm, am};
}
/* 時刻 t と、再生で小さくしていく Δt */
function times(ctx){
  const {P} = ctx, pa = PATHS[P.path], t0 = P.tp*pa.T;
  const cap = pa.periodic ? Infinity : pa.T - t0, dt0 = Math.min(P.dt, cap);
  const D = ctx.dur, tau = ctx.t;
  const dt = tau >= D - 1e-9 ? 0 : dt0*Math.pow(1 - tau/D, 2);
  return {pa, t0, dt0, dt, capped:P.dt > cap + 1e-9};
}
const sub = (p, q) => [p[0]-q[0], p[1]-q[1]];
const mul = (p, k) => [p[0]*k, p[1]*k];
const vec = (p, d=2) => `(${f(p[0], d)}, ${f(p[1], d)})`;
const len = p => hypot(p[0], p[1]);
function angDeg(p, q){ if(len(p) < 1e-9 || len(q) < 1e-9) return 0; let d = atan2(p[1], p[0]) - atan2(q[1], q[0]); while(d > PI) d -= 2*PI; while(d < -PI) d += 2*PI; return abs(d)*180/PI; }
/* 領域 R の中に世界座標 b を等倍率で収める */
function fitR(R, b, pad=14){
  const bw = Math.max(b.x1 - b.x0, 1e-6), bh = Math.max(b.y1 - b.y0, 1e-6);
  const s = Math.min((R.w - 2*pad)/bw, (R.h - 2*pad)/bh);
  const ox = R.x + (R.w - bw*s)/2, oy = R.y + (R.h - bh*s)/2;
  return {s, X:x => ox + (x - b.x0)*s, Y:y => oy + bh*s - (y - b.y0)*s};
}
function grow(b, m){ return {x0:b.x0 - m, x1:b.x1 + m, y0:b.y0 - m, y1:b.y1 + m}; }
/* 太字斜体のベクトル記号（bar ＝ 上線つき、平均を表す） */
function vlab(c, txt, x, y, color, opt={}){
  c.save(); c.font = symFont(opt.px || 15, true); c.fillStyle = color; c.textAlign = opt.align || "left"; c.textBaseline = "middle";
  const pre = opt.pre || "", post = opt.post || "";
  c.font = symFont(opt.px || 15, false); const wp = c.measureText(pre).width; c.font = symFont(opt.px || 15, true); const wv = c.measureText(txt).width; c.font = uiFont(12); const wq = c.measureText(post).width;
  const tot = wp + wv + wq; let x0 = x; if(c.textAlign === "right") x0 = x - tot; else if(c.textAlign === "center") x0 = x - tot/2;
  c.textAlign = "left";
  c.font = symFont(opt.px || 15, false); c.fillText(pre, x0, y);
  c.font = symFont(opt.px || 15, true); c.fillText(txt, x0 + wp, y);
  if(opt.bar){ c.strokeStyle = color; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x0 + wp + 1, y - 9); c.lineTo(x0 + wp + wv + 1, y - 9); c.stroke(); }
  c.font = uiFont(12); c.fillText(post, x0 + wp + wv + 1, y + 1);
  c.restore();
}
/* 矢印の先に少し離してラベルを置く */
function tipPos(x1, y1, x2, y2, gap=14){ const L = hypot(x2-x1, y2-y1) || 1; return [x2 + (x2-x1)/L*gap, y2 + (y2-y1)/L*gap]; }
function frac(a, b){ return `<span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px"><span style="border-bottom:1px solid currentColor;padding:0 2px">${a}</span><span>${b}</span></span>`; }
const BAR = s => `<span style="text-decoration:overline">${s}</span>`;
const LIM = `lim<sub style="font-size:.7em">Δ${S("t")}→0</sub>`;

/* x-t などのグラフに、割線（平均）と接線（瞬間）を重ねる */
function secTan(cv, o){
  const g = graph(cv, {title:o.title, unit:o.unit, tmax:o.tmax, series:[{fn:o.fn, color:o.color}]});
  const {c, X, Y, w, h} = g, t0 = o.t0, t1 = o.t0 + o.dt, y0 = o.fn(t0), y1 = o.fn(t1);
  c.save(); c.beginPath(); c.rect(8, 22, w - 16, h - 38); c.clip();
  const L = -o.tmax, Rr = 2*o.tmax;
  c.lineWidth = 1.6; c.strokeStyle = css("--ink2"); c.setLineDash([5,4]);
  c.beginPath(); c.moveTo(X(L), Y(y0 + o.slope*(L - t0))); c.lineTo(X(Rr), Y(y0 + o.slope*(Rr - t0))); c.stroke(); c.setLineDash([]);
  if(o.dt > 1e-9){
    const m = (y1 - y0)/o.dt; c.strokeStyle = css("--hl2"); c.lineWidth = 2;
    c.beginPath(); c.moveTo(X(L), Y(y0 + m*(L - t0))); c.lineTo(X(Rr), Y(y0 + m*(Rr - t0))); c.stroke();
    disc(c, X(t1), Y(y1), 4, css("--hl2"));
  }
  disc(c, X(t0), Y(y0), 4.5, css(o.color));
  c.restore();
  c.font = numFont(11); c.textAlign = "right"; c.textBaseline = "alphabetic";
  c.fillStyle = css("--hl2"); c.fillText(o.dt > 1e-9 ? `割線 ${f((y1-y0)/o.dt, 2)}` : "", w - 8, h - 4);
  c.fillStyle = css("--ink2"); c.textAlign = "left"; c.fillText(`接線 ${f(o.slope, 2)}`, 12, h - 4);
}

/* ---------- 平均の速度 → 瞬間の速度 ---------- */
const velMode = {
  label:"平均の速度 → 瞬間の速度",
  params:[["tp","点 P の時刻（運動全体を 0〜1 として）",0,0.95,0.01,"",2,0.12],["dt","時間間隔 Δt の最初の値",0.1,3,0.05,"s",2,1.6]],
  selects:[["path","運動",PATH_OPTS,"eight"]],
  toggles:[["pos","位置ベクトル",true],["comp","Δx・Δy に分ける",false],["trail","途中の弦を残す",true],["inst","瞬間の速度（接線）",true]],
  timed:true, graphs:2, dt:1/60,
  legend:`<span><i style="background:var(--pos)"></i>位置ベクトル <b class="vb">r</b></span><span><i style="background:var(--hl2)"></i>変位 Δ<b class="vb">r</b>（弦）</span><span><i style="background:var(--vel);opacity:.55"></i>平均の速度 ${BAR(V("v"))}</span><span><i style="background:var(--vel)"></i>瞬間の速度 <b class="vb">v</b></span>`,
  reset(){}, duration(){ return 5; }, step(){},
  draw(ctx){
    const {P, T} = ctx, {pa, t0, dt0, dt, capped} = times(ctx), st = stats(pa);
    const ar = window.innerWidth < 600 ? "4 / 3" : "16 / 10"; if(ctx.stage.style.aspectRatio !== ar) ctx.stage.style.aspectRatio = ar;
    const {c, w, h} = prep(ctx.stage);
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), hl2 = css("--hl2");
    const tf = fitR({x:0, y:0, w, h}, grow(st.b, 0.6), 12);
    const span = Math.max(st.b.x1 - st.b.x0, st.b.y1 - st.b.y0), kv = 0.32*span/st.vm;
    // 座標軸
    c.strokeStyle = css("--grid2"); c.lineWidth = 1; c.beginPath(); c.moveTo(tf.X(-0.4), tf.Y(0)); c.lineTo(tf.X(st.b.x1 + 0.5), tf.Y(0)); c.moveTo(tf.X(0), tf.Y(-0.4)); c.lineTo(tf.X(0), tf.Y(st.b.y1 + 0.5)); c.stroke();
    label(c, "O", tf.X(0) - 6, tf.Y(0) + 10, ink3, "right", symFont(13)); label(c, "x", tf.X(st.b.x1 + 0.5), tf.Y(0) + 11, ink3, "right", symFont(13)); label(c, "y", tf.X(0) + 7, tf.Y(st.b.y1 + 0.45), ink3, "left", symFont(13));
    // 軌道
    c.strokeStyle = ink3; c.lineWidth = 1.6; c.beginPath();
    for(let i = 0; i <= 300; i++){ const p = pa.r(pa.T*i/300); i ? c.lineTo(tf.X(p[0]), tf.Y(p[1])) : c.moveTo(tf.X(p[0]), tf.Y(p[1])); } c.stroke();
    const rP = pa.r(t0), rQ = pa.r(t0 + dt), vP = pa.v(t0), dr = sub(rQ, rP), vbar = dt > 1e-9 ? mul(dr, 1/dt) : vP;
    const Px = tf.X(rP[0]), Py = tf.Y(rP[1]), Qx = tf.X(rQ[0]), Qy = tf.Y(rQ[1]);
    // 途中の弦
    if(T.trail && dt0 > 1e-9){
      c.globalAlpha = 0.35;
      [1, 0.8, 0.6, 0.42, 0.27, 0.15].forEach(k => { const d = dt0*k; if(d <= dt + 1e-9) return; const q = pa.r(t0 + d);
        c.strokeStyle = hl2; c.lineWidth = 1.2; c.beginPath(); c.moveTo(Px, Py); c.lineTo(tf.X(q[0]), tf.Y(q[1])); c.stroke(); disc(c, tf.X(q[0]), tf.Y(q[1]), 2.5, hl2); });
      c.globalAlpha = 1;
    }
    // 位置ベクトル
    if(T.pos){
      arrow(c, tf.X(0), tf.Y(0), Px, Py, pos, 1.8);
      if(dt > 1e-9) arrow(c, tf.X(0), tf.Y(0), Qx, Qy, pos, 1.4, [5,4]);
      const m1 = [(tf.X(0) + Px)/2, (tf.Y(0) + Py)/2];
      vlab(c, "r", m1[0] - 6, m1[1] - 8, pos, {align:"right", post:"(t)"});
      if(dt > 1e-9 && hypot(Qx - Px, Qy - Py) > 26){ const m2 = [(tf.X(0) + Qx)/2, (tf.Y(0) + Qy)/2]; vlab(c, "r", m2[0] + 6, m2[1] + 10, pos, {post:"(t+Δt)"}); }
    }
    // 接線
    if(T.inst){
      const L = len(vP) || 1, u = [vP[0]/L, vP[1]/L], e = span*0.9;
      c.strokeStyle = ink3; c.lineWidth = 1; c.setLineDash([3,4]); c.beginPath(); c.moveTo(tf.X(rP[0] - u[0]*e), tf.Y(rP[1] - u[1]*e)); c.lineTo(tf.X(rP[0] + u[0]*e), tf.Y(rP[1] + u[1]*e)); c.stroke(); c.setLineDash([]);
    }
    // 変位（弦）と成分
    if(dt > 1e-9){
      if(T.comp){
        c.strokeStyle = hl2; c.lineWidth = 1.2; c.setLineDash([3,3]); c.beginPath(); c.moveTo(Px, Py); c.lineTo(Qx, Py); c.lineTo(Qx, Qy); c.stroke(); c.setLineDash([]);
        if(abs(Qx - Px) > 18) label(c, "Δx", (Px + Qx)/2, Py + (Qy < Py ? 11 : -11), hl2, "center", symFont(13));
        if(abs(Qy - Py) > 18) label(c, "Δy", Qx + (Qx > Px ? 6 : -6), (Py + Qy)/2, hl2, Qx > Px ? "left" : "right", symFont(13));
      }
      arrow(c, Px, Py, Qx, Qy, hl2, 2.6);
      disc(c, Qx, Qy, 5, css("--surface"), hl2);
      if(hypot(Qx - Px, Qy - Py) > 30){ const [lx, ly] = [(Px + Qx)/2, (Py + Qy)/2], L = hypot(Qx-Px, Qy-Py), nx = -(Qy-Py)/L, ny = (Qx-Px)/L; vlab(c, "r", lx + nx*14, ly + ny*14, hl2, {pre:"Δ", align:"center"}); }
      label(c, "Q", Qx + 8, Qy - 10, hl2, "left", symFont(14));
    }
    // 平均の速度と瞬間の速度（同じ倍率）
    const Ax = Px + vbar[0]*kv*tf.s, Ay = Py - vbar[1]*kv*tf.s;
    if(T.inst){ const Ix = Px + vP[0]*kv*tf.s, Iy = Py - vP[1]*kv*tf.s; arrow(c, Px, Py, Ix, Iy, vel, 3); const [lx, ly] = tipPos(Px, Py, Ix, Iy, 14); vlab(c, "v", lx, ly - (dt > 1e-9 ? 9 : 0), vel, {align:"center"}); }
    if(dt > 1e-9){ c.globalAlpha = 0.65; arrow(c, Px, Py, Ax, Ay, vel, 3, [7,4]); c.globalAlpha = 1; const L = hypot(Ax-Px, Ay-Py) || 1, nx = -(Ay-Py)/L, ny = (Ax-Px)/L; vlab(c, "v", Ax - nx*16, Ay - ny*16, vel, {align:"center", bar:true}); }
    disc(c, Px, Py, 6, pos);
    label(c, "P", Px - 9, Py + 13, pos, "right", symFont(14));
    // 文と数値
    if(dt <= 1e-9) ctx.banner("Δt → 0：平均の速度は、瞬間の速度（軌道の接線の向き）と一致する", "--vel");
    else ctx.banner(`Δt ＝ ${f(dt, 3)} s　　平均の速度と瞬間の速度の向きのずれ ${f(angDeg(vbar, vP), 1)}°${capped ? "（放物運動は地面に着くまでで打ち切り）" : ""}`, "--hl2");
    secTan(ctx.graphs[0], {title:"x-t（傾き ＝ vₓ）", unit:"m", tmax:pa.T, fn:t => pa.r(t)[0], color:"--pos", t0, dt, slope:vP[0]});
    secTan(ctx.graphs[1], {title:"y-t（傾き ＝ vᵧ）", unit:"m", tmax:pa.T, fn:t => pa.r(t)[1], color:"--pos", t0, dt, slope:vP[1]});
    ctx.ro(table([
      [`時刻 ${S("t")}・時間間隔 Δ${S("t")}`, `${f(t0, 2)} s・${f(dt, 3)} s`],
      [`変位 Δ${V("r")} ＝ (Δ${S("x")}, Δ${S("y")})`, `${vec(dr, 3)} m`],
      [`平均の速度 ${BAR(V("v"))} ＝ Δ${V("r")}/Δ${S("t")}`, dt > 1e-9 ? `${vec(vbar)} m/s` : "—（Δt ＝ 0 では割れない）"],
      [`瞬間の速度 ${V("v")} ＝ (${S("v")}<sub>x</sub>, ${S("v")}<sub>y</sub>)`, `${vec(vP)} m/s`],
      [`大きさ |Δ${V("r")}|・|${BAR(V("v"))}|・|${V("v")}|`, `${f(len(dr), 3)} m・${dt > 1e-9 ? f(len(vbar), 2) : "—"}・${f(len(vP), 2)} m/s`]
    ]));
    ctx.eqs(`<p class="eq"><span class="tag n">微積なし</span>平均の速度 ${BAR(V("v"))} ＝ ${frac("Δ"+V("r"), "Δ"+S("t"))}（Δ${V("r")} ＝ ${V("r")}(${S("t")}＋Δ${S("t")}) − ${V("r")}(${S("t")})、向きは弦 PQ の向き）。Δ${S("t")} を小さくすると Q が P に近づき、弦の向きは<b>接線</b>に近づく。</p>
<p class="eq"><span class="tag c">微積</span>${V("v")} ＝ ${LIM} ${frac("Δ"+V("r"), "Δ"+S("t"))} ＝ ${frac("d"+V("r"), "d"+S("t"))}、成分で ${S("v")}<sub>x</sub> ＝ ${frac("d"+S("x"), "d"+S("t"))}、${S("v")}<sub>y</sub> ＝ ${frac("d"+S("y"), "d"+S("t"))}（${S("x")}-${S("t")}・${S("y")}-${S("t")} グラフの接線の傾き）</p>
<p class="note">グラフの紫の直線は割線（傾き ＝ 平均）、点線は接線（傾き ＝ 瞬間）。再生すると Δt が 0 に近づく。止めて、時刻スライダーで Δt の大きさを選んでもよい。</p>`);
  },
  asks:[
    ["Δt を小さくしていくと、変位 |Δ<b class='vb'>r</b>| と平均の速度 |Δ<b class='vb'>r</b>/Δt| はそれぞれどうなるか。", "|Δr| は 0 に近づくが、Δt も 0 に近づくので、その比 |Δr/Δt| は 0 にならず、点 P での速さ |v| に近づく。"],
    ["再生の最後で、弦 PQ の向きはどうなっているか。", "点 P での軌道の接線の向き。だから瞬間の速度は、いつも軌道の接線方向を向く。"],
    ["x-t グラフの紫の直線（割線）と点線（接線）の傾きは、それぞれ何を表すか。", "割線の傾き Δx/Δt は平均の速度の x 成分、接線の傾き dx/dt は瞬間の速度の x 成分 vₓ。"],
    ["「等速円運動」にして、平均の速度の大きさと瞬間の速さを比べよう。どちらが大きいか。", "平均の速度のほうが小さい。弦は弧より短いから（|Δr| < 弧の長さ ＝ vΔt）。Δt → 0 で等しくなる。"]
  ]
};

/* ---------- 平均の加速度 → 瞬間の加速度 ---------- */
const accMode = {
  label:"平均の加速度 → 瞬間の加速度",
  params:[["tp","点 P の時刻（運動全体を 0〜1 として）",0,0.95,0.01,"",2,0.12],["dt","時間間隔 Δt の最初の値",0.1,3,0.05,"s",2,1.6]],
  selects:[["path","運動",PATH_OPTS,"eight"]],
  toggles:[["hodo","速度の先端がえがく曲線",true],["trail","途中の Δv を残す",true],["inst","瞬間の加速度",true]],
  timed:true, graphs:2, dt:1/60,
  legend:`<span><i style="background:var(--vel)"></i>速度 <b class="vb">v</b></span><span><i style="background:var(--hl2)"></i>速度の変化 Δ<b class="vb">v</b></span><span><i style="background:var(--acc);opacity:.55"></i>平均の加速度 ${BAR(`<b class="vb">a</b>`)}</span><span><i style="background:var(--acc)"></i>瞬間の加速度 <b class="vb">a</b></span>`,
  reset(){}, duration(){ return 5; }, step(){},
  draw(ctx){
    const {P, T} = ctx, {pa, t0, dt0, dt, capped} = times(ctx), st = stats(pa);
    const ar = window.innerWidth < 600 ? "3 / 4" : "16 / 10"; if(ctx.stage.style.aspectRatio !== ar) ctx.stage.style.aspectRatio = ar;
    const {c, w, h} = prep(ctx.stage);
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), hl2 = css("--hl2"), acc = css("--acc");
    const side = w > h*1.15;
    const R1 = side ? {x:0, y:0, w:w*0.54, h} : {x:0, y:0, w, h:h*0.5};
    const R2 = side ? {x:w*0.54, y:0, w:w*0.46, h} : {x:0, y:h*0.5, w, h:h*0.5};
    const span = Math.max(st.b.x1 - st.b.x0, st.b.y1 - st.b.y0);
    const tf = fitR({x:R1.x, y:R1.y + 16, w:R1.w, h:R1.h - 16}, grow(st.pb, 0.22*span), 6), kv = 0.25*span/st.vm, ka = 0.25*span/st.am;
    // 左：軌道

    // 右：ベクトルの三角形
    c.strokeStyle = css("--line"); c.lineWidth = 1; c.beginPath(); if(side){ c.moveTo(R2.x, 6); c.lineTo(R2.x, h - 6); } else { c.moveTo(6, R2.y); c.lineTo(w - 6, R2.y); } c.stroke();
    const tri = (R, va, vab, vb, colB, sym, title, max) => {
      label(c, title, R.x + 8, R.y + 12, ink2, "left", uiFont(12, true));
      const k = 0.44*Math.min(R.w, R.h - 24)/max;
      const ox = R.x + R.w/2 - vb[0]*k/2, oy = R.y + 24 + (R.h - 24)/2 + vb[1]*k/2;
      const p1 = [ox + va[0]*k, oy - va[1]*k], p2 = [ox + vb[0]*k, oy - vb[1]*k];
      arrow(c, ox, oy, p1[0], p1[1], pos, 2.2); arrow(c, p1[0], p1[1], p2[0], p2[1], hl2, 2.2); arrow(c, ox, oy, p2[0], p2[1], colB, 3);
      disc(c, ox, oy, 3, ink2);
      const lab = (p, q, sb, col, sgn) => { const L = hypot(q[0]-p[0], q[1]-p[1]); if(L < 10) return; const nx = -(q[1]-p[1])/L*sgn, ny = (q[0]-p[0])/L*sgn; vlab(c, sym, (p[0]+q[0])/2 + nx*16, (p[1]+q[1])/2 + ny*16, col, {align:"center", post:sb, px:13}); };
      lab([ox, oy], p1, "A", pos, 1); lab(p1, p2, "AB", hl2, 1); lab([ox, oy], p2, "B", colB, -1);
      if(len(vab) < 1e-9) vlab(c, sym, R.x + R.w - 50, R.y + R.h - 12, hl2, {post:"AB ＝ 0", px:13});
    };
    const hf = side ? [{x:R2.x, y:R2.y, w:R2.w, h:R2.h/2}, {x:R2.x, y:R2.y + R2.h/2, w:R2.w, h:R2.h/2}] : [{x:R2.x, y:R2.y, w:R2.w/2, h:R2.h}, {x:R2.x + R2.w/2, y:R2.y, w:R2.w/2, h:R2.h}];
    tri(hf[0], vA, vAB, vB, vel, "v", "速度の三角形", s.vm);
    tri(hf[1], aA, aAB, aB, acc, "a", "加速度の三角形", s.am);
    // 文
    const msg = {
      train: gv ? "地面から見ると、ボールの加速度は g（鉛直下向き）だけ。初速は「電車の速度 ＋ 電車に対して投げた速度」の合成" : (P.aA > 0 ? "電車から見ると、ボールは後ろへずれていく。aAB ＝ g − aA（後ろ斜め下向きで一定）" : "等速の電車から見ると、地上と同じように運動する（aAB ＝ g）"),
      crane: gv ? "地面から見た荷物の加速度は aB ＝ aA ＋ aAB（斜め上向きで一定）" : "台車から見ると、荷物は真上に加速して上がるだけ",
      throws: gv ? "地面から見ると、どちらも放物線" : "A から見ると、B は等速直線運動（aAB ＝ g − g ＝ 0）。0.25 s ごとの点が等間隔に並ぶ"
    }[P.ex];
    ctx.banner(msg, gv ? "--ink2" : "--hl2");
    const D = s.dur;
    graph(ctx.graphs[0], {title:"vₓ-t", unit:"m/s", tmax:D, t, series:[{fn:tt => s.vB(tt)[0], color:"--vel", name:"地面から"}, {fn:tt => s.vB(tt)[0] - s.vA(tt)[0], color:"--hl2", name:"A から"}]});
    graph(ctx.graphs[1], {title:"vᵧ-t", unit:"m/s", tmax:D, t, series:[{fn:tt => s.vB(tt)[1], color:"--vel", name:"地面から"}, {fn:tt => s.vB(tt)[1] - s.vA(tt)[1], color:"--hl2", name:"A から"}]});
    ctx.ro(table([
      [`${s.nameA}：${VS("v","A")}・${VS("a","A")}`, `${vec(vA, 1)} m/s・${vec(aA, 1)} m/s²`],
      [`${s.nameB}（地面から）：${VS("v","B")}・${VS("a","B")}`, `${vec(vB, 1)} m/s・${vec(aB, 1)} m/s²`],
      [`A から見た B：${VS("v","AB")}・${VS("a","AB")}`, `${vec(vAB, 1)} m/s・${vec(aAB, 1)} m/s²`]
    ]));
    ctx.eqs(`<p class="eq"><span class="tag n">微積なし</span>合成 ${VS("v","B")} ＝ ${VS("v","A")} ＋ ${VS("v","AB")}、相対 ${VS("v","AB")} ＝ ${VS("v","B")} − ${VS("v","A")}。変化を Δ${S("t")} で割ると ${frac("Δ"+VS("v","AB"), "Δ"+S("t"))} ＝ ${frac("Δ"+VS("v","B"), "Δ"+S("t"))} − ${frac("Δ"+VS("v","A"), "Δ"+S("t"))} なので、${VS("a","AB")} ＝ ${VS("a","B")} − ${VS("a","A")}（合成では ${VS("a","B")} ＝ ${VS("a","A")} ＋ ${VS("a","AB")}）</p>
<p class="eq"><span class="tag c">微積</span>${VS("r","B")} ＝ ${VS("r","A")} ＋ ${VS("r","AB")} を ${S("t")} で微分して ${VS("v","B")} ＝ ${VS("v","A")} ＋ ${VS("v","AB")}、もう一度微分して ${VS("a","B")} ＝ ${VS("a","A")} ＋ ${VS("a","AB")}</p>
<p class="note">グラフの傾きは加速度の成分。2本の傾きの差が A の加速度。速度が一定のときの合成・相対速度（川を渡る船、雨と走る人）は、物理基礎ラボの「相対速度」で確かめられる。</p>`);
  },
  asks:[
    ["「2つのボールを同時に投げる」を A から見ると、B はどう動くか。", "まっすぐ等速で動く。a<sub>AB</sub> ＝ g − g ＝ 0 だから。A から見て B が自分のほうへ向かっていれば、必ず衝突する（モンキーハンティングの理由）。"],
    ["「加速する電車」で投げる速さを 0（静かに放す）にする。電車から見ると、ボールはどう落ちるか。", "後ろ斜め下へ、まっすぐ落ちる。初速 0 で、加速度 a<sub>AB</sub> ＝ g − a<sub>A</sub> が一定だから。鉛直からの傾き θ は tan θ ＝ a<sub>A</sub>/g。単元4の慣性力 −m a<sub>A</sub> で説明できる。"],
    ["電車の加速度を 0 にして真上に投げると、電車から見たボールはどうなるか。", "真上に上がって手元にもどる。等速で動く乗り物から見ても、加速度は地上と同じ g。"],
    ["「クレーン」で、地面から見た荷物の軌跡はどんな形か。加速度の向きは？", "放物線。加速度は a<sub>B</sub> ＝ a<sub>A</sub>（右向き）＋ a<sub>AB</sub>（上向き）で、斜め上向きの一定。台車に初速があるので、速度と加速度の向きがずれて曲がる。"]
  ]
};

LAB.app({title:"速度・加速度の定義ラボ", modes:{vel:velMode, acc:accMode, rel:relMode}});
})();
</script>
