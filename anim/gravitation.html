<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万有引力ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="lab.css">
<script src="../js/italic.js"></script>
<script src="lab-common.js"></script>
</head>
<body>
<script>
(function(){
"use strict";
const {f, S, V, css, prep, arrow, label, symFont, uiFont, numFont, fit, disc, table, graph} = LAB;
const PI2 = Math.PI*2, DISP = 10;   // DISP：1周などを何秒で見せるか
/* 中心天体（質量は GM、半径 R）。軌道・打ち上げ・軌道の変更のモードで切りかえる */
const BODIES = {
  earth:{ch:"地", n:"地球", GM:4.0e14, R:6.4e6, c1:"#5fa8e8", c2:"#1f5fa8", lab:"#fff"},
  moon:{ch:"月", n:"月", GM:4.9e12, R:1.74e6, c1:"#f0f0e8", c2:"#8f8f88", lab:"#333"},
  venus:{ch:"金", n:"金星", GM:3.25e14, R:6.05e6, c1:"#f4e2b0", c2:"#c9954a", lab:"#5a3a10"},
  mars:{ch:"火", n:"火星", GM:4.28e13, R:3.39e6, c1:"#f0a37c", c2:"#a8431f", lab:"#fff"},
  jupiter:{ch:"木", n:"木星", GM:1.267e17, R:7.15e7, c1:"#efd3ab", c2:"#b9824d", lab:"#3a2410"},
  sun:{ch:"日", n:"太陽", GM:1.327e20, R:6.96e8, c1:"#fff2b0", c2:"#e8a32e", lab:"#5a3a00"}
};
let GM = 4.0e14, R = 6.4e6, BODY = BODIES.earth, EU = 1e7, EUN = "×10⁷ J";
const SUPD = {"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sup = n => String(n).split("").map(ch => SUPD[ch] || ch).join("");
const sci = x => { const n = Math.floor(Math.log10(x)); return `${(x/Math.pow(10, n)).toFixed(1)} × 10${sup(n)}`; };
function setBody(k){ BODY = BODIES[k] || BODIES.earth; GM = BODY.GM; R = BODY.R; const n = Math.floor(Math.log10(GM/R)); EU = Math.pow(10, n); EUN = "×10" + sup(n) + " J"; }
const BODY_SEL = ["body","中心天体",[["earth","地球"],["moon","月"],["venus","金星"],["mars","火星"],["jupiter","木星"],["sun","太陽"]],"earth"];
function vRng(P){ setBody(P.body); const vs = Math.sqrt(GM/R)/1e3, st = vs < 5 ? 0.02 : vs < 20 ? 0.05 : vs < 100 ? 0.1 : 1; return [+Math.max(st, Math.round(0.127*vs/st)*st).toFixed(2), +(Math.round(1.77*vs/st)*st).toFixed(2), st]; }
const vStep = P => vRng(P)[2];
let oBody = null, eBody = null, tBody = null;

function earth(c, tf, ink2){
  const g = c.createRadialGradient(tf.X(0) - 0.3*R*tf.s, tf.Y(0) - 0.3*R*tf.s, 0.1*R*tf.s, tf.X(0), tf.Y(0), R*tf.s);
  g.addColorStop(0, BODY.c1); g.addColorStop(1, BODY.c2);
  c.fillStyle = g; c.beginPath(); c.arc(tf.X(0), tf.Y(0), R*tf.s, 0, PI2); c.fill();
  label(c, BODY.n, tf.X(0), tf.Y(0), BODY.lab, "center", uiFont(12, true));
}

/* ---------- 人工衛星の軌道 ---------- */
const orbit = {
  label:"人工衛星の軌道",
  params:[["r0","打ち出す位置（中心から、R の何倍）",1.05,4,0.05,"R",2,2],["v0","打ち出す速さ（水平）",1,14,0.05,"km/s",2,5.6,vRng]],
  selects:[BODY_SEL],
  toggles:[["area","面積速度（等しい時間の扇形）",true]],
  timed:true, graphs:3,
  legend:`<span><i style="background:var(--pos)"></i>衛星・軌道</span><span><i style="background:var(--vel)"></i>速度</span><span><i style="background:var(--acc)"></i>万有引力</span><span><i style="background:var(--hl2)"></i>等しい時間に通る扇形</span>`,
  reset(P, St){
    setBody(P.body);
    if((oBody !== null && P.body !== oBody) || (oBody === null && P.body !== "earth" && P.r0 === 2 && P.v0 === 5.6)){ const st = vStep(P); P.r0 = 2; P.v0 = +(Math.round(Math.sqrt(GM/(2*R))/1e3/st)*st).toFixed(2); }
    oBody = P.body;
    const r0 = P.r0*R, v0 = P.v0*1e3, eps = v0*v0/2 - GM/r0;
    St.x = r0; St.y = 0; St.vx = 0; St.vy = v0; St.tp = 0; St.crash = false; St.trace = [[r0, 0, 0]]; St.ts = [[0, P.r0, P.v0, eps]];
    if(eps < 0){ const a = -GM/(2*eps); St.bound = true; St.a = a; St.Tphys = PI2*Math.sqrt(a*a*a/GM); St.span = St.Tphys*1.02; }
    else { St.bound = false; St.Tphys = null; St.span = 8*r0/v0*3; }
    St.scale = St.span/DISP; St.secDt = St.bound ? St.Tphys/12 : St.span/12; St.secs = [[0, r0, 0]]; St.nextSec = St.secDt; St.eps = eps;
  },
  duration(P, St){ return DISP; },
  step(P, St, dt){
    if(St.crash) return;
    let rem = dt*St.scale; const h = (St.bound ? St.Tphys : St.span)/4000;
    while(rem > 0){
      const d = Math.min(h, rem), r = Math.hypot(St.x, St.y), ax = -GM*St.x/r**3, ay = -GM*St.y/r**3;
      St.vx += ax*d/2; St.vy += ay*d/2; St.x += St.vx*d; St.y += St.vy*d;
      const r2 = Math.hypot(St.x, St.y); St.vx += -GM*St.x/r2**3*d/2; St.vy += -GM*St.y/r2**3*d/2;
      St.tp += d; rem -= d;
      if(r2 < R){ St.crash = true; break; }
      if(St.tp >= St.nextSec){ St.secs.push([St.tp, St.x, St.y]); St.nextSec += St.secDt; }
      St.trace.push([St.x, St.y, St.tp]);
    }
    const r = Math.hypot(St.x, St.y), v = Math.hypot(St.vx, St.vy);
    St.ts.push([St.tp/3600, r/R, v/1e3, v*v/2 - GM/r]);
  },
  draw(ctx){
    const {P, S:St, T} = ctx; const {c, w, h} = prep(ctx.stage);
    let ext = P.r0*1.15;
    if(St.bound){ const hh = P.r0*R*P.v0*1e3, ecc = Math.sqrt(Math.max(0, 1 + 2*St.eps*hh*hh/(GM*GM))), ra = St.a*(1 + ecc); ext = Math.min(Math.max(ext, ra/R*1.08), 14); } else ext = Math.min(Math.max(ext, 6), 14);
    const tf = fit(w, h, {x0:-ext*R, x1:ext*R, y0:-ext*R, y1:ext*R}, 8);
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel"), acc = css("--acc"), hl2 = css("--hl2");
    // reference circle orbit at r0
    c.strokeStyle = ink3; c.setLineDash([3,5]); c.beginPath(); c.arc(tf.X(0), tf.Y(0), P.r0*R*tf.s, 0, PI2); c.stroke(); c.setLineDash([]);
    // sectors（等しい時間ごとの扇形）
    if(T.area){
      let cur = -1;
      const flush = () => { if(cur >= 0){ c.lineTo(tf.X(0), tf.Y(0)); c.closePath(); c.fillStyle = hl2; c.globalAlpha = (cur % 2) ? 0.10 : 0.24; c.fill(); c.globalAlpha = 1; } };
      const step2 = Math.max(1, Math.floor(St.trace.length/3000));
      for(let j2 = 0; j2 < St.trace.length; j2 += step2){
        const p = St.trace[j2], k = Math.floor(p[2]/St.secDt);
        if(k !== cur){ if(cur >= 0){ c.lineTo(tf.X(p[0]), tf.Y(p[1])); } flush(); cur = k; c.beginPath(); c.moveTo(tf.X(0), tf.Y(0)); }
        c.lineTo(tf.X(p[0]), tf.Y(p[1]));
      }
      flush();
    }
    // trajectory
    c.strokeStyle = pos; c.lineWidth = 1.8; c.beginPath(); const step = Math.max(1, Math.floor(St.trace.length/1500));
    St.trace.forEach((p, i) => { if(i % step === 0 || i === St.trace.length - 1){ i ? c.lineTo(tf.X(p[0]), tf.Y(p[1])) : c.moveTo(tf.X(p[0]), tf.Y(p[1])); } }); c.stroke();
    earth(c, tf, ink2);
    const sx = tf.X(St.x), sy = tf.Y(St.y), r = Math.hypot(St.x, St.y), v = Math.hypot(St.vx, St.vy);
    const kv = 0.35*Math.min(w, h)/(1.77*Math.sqrt(GM/R));
    arrow(c, sx, sy, sx + St.vx*kv, sy - St.vy*kv, vel, 2.6);
    const ga = Math.max(16, Math.min(80, 34*(GM/(r*r))/(GM/(P.r0*R)**2)));
    arrow(c, sx, sy, sx - St.x/r*ga, sy + St.y/r*ga, acc, 2.2);
    disc(c, sx, sy, 6, pos);
    const vc = Math.sqrt(GM/(P.r0*R))/1e3, ve = Math.sqrt(2*GM/(P.r0*R))/1e3;
    let type;
    if(St.crash) type = `${BODY.n}の表面に落ちた（速さが足りない）`;
    else if(Math.abs(P.v0 - vc) < 0.03) type = "円軌道（v₀ ＝ √(GM/r)）";
    else if(P.v0 < vc) type = `楕円軌道（打ち出した点が遠${BODY.ch}点）`;
    else if(P.v0 < ve - 1e-9) type = `楕円軌道（打ち出した点が近${BODY.ch}点）`;
    else type = P.v0 < ve + 0.03 ? "放物線軌道（ちょうど脱出）" : `双曲線軌道（${BODY.n}から離れていく）`;
    ctx.banner(type, St.crash ? "--neg" : St.bound ? "--ui" : "--acc");
    const ts = St.ts;
    graph(ctx.graphs[0], {title:"中心からの距離 r-t（R の何倍）", unit:"", tmax:St.span/3600, t:St.tp/3600, ylo:0, series:[{pts:ts.map(p => [p[0], p[1]]), color:"--pos"}]});
    graph(ctx.graphs[1], {title:"速さ v-t", unit:"km/s", tmax:St.span/3600, t:St.tp/3600, ylo:0, series:[{pts:ts.map(p => [p[0], p[2]]), color:"--vel"}]});
    graph(ctx.graphs[2], {title:`1 kg あたりのエネルギー（${EUN}）`, unit:"", tmax:St.span/3600, t:St.tp/3600, series:[
      {pts:ts.map(p => [p[0], (p[2]*1e3)**2/2/EU]), color:"--vel", name:"運動"}, {pts:ts.map(p => [p[0], -GM/(p[1]*R)/EU]), color:"--hl2", name:"位置"}, {pts:ts.map(p => [p[0], p[3]/EU]), color:"--acc", name:"和"}]});
    const rows = [[`経過時間`, `${f(St.tp/3600,2)} h`], [`いまの距離・速さ`, `${f(r/R,2)} R・${f(v/1e3,2)} km/s`],
      [`この位置での円軌道の速さ √(${S("G")}${S("M")}/${S("r")})`, `${f(vc,2)} km/s`], [`脱出速度 √(2${S("G")}${S("M")}/${S("r")})`, `${f(ve,2)} km/s`],
      [`力学的エネルギー（1 kg あたり）`, `${f(St.eps/EU,3)} ${EUN}（${St.eps < 0 ? "負：束縛" : "0以上：脱出"}）`]];
    if(St.bound) rows.push([`周期`, `${f(St.Tphys/3600,2)} h`], [`面積速度 ½${S("r")}${S("v")}`, `${sci(0.5*P.r0*R*P.v0*1e3)} m²/s（一定）`]);
    ctx.ro(table(rows));
    ctx.eqs(`<p class="eq">${S("G")}${S("M")} ≒ ${sci(GM)} m³/s²、${S("R")} ＝ ${sci(R)} m（${BODY.n}）。扇形は ${St.bound ? "周期の 1/12" : "等しい時間"} ごと。どれも面積が等しい（ケプラーの第2法則）。</p>
      <p class="eq">½${S("m")}${S("v")}² − ${S("G")}${S("M")}${S("m")}/${S("r")} ＝ 一定（緑の線が水平）。近づくと位置エネルギーが減り、速くなる。</p>`);
  },
  asks:[
    ["中心天体が地球のとき、r₀ ＝ 2R で v₀ ＝ 5.6 km/s にしよう。どんな軌道か。周期は？", "円軌道。周期は約 4.0 h。"],
    ["v₀ を 6.5 km/s に上げよう。扇形（等しい時間に通る部分）の形を比べよう。", "遠地点の近くでは細長く、近地点の近くでは太く短い。面積は等しい（面積速度一定）。"],
    ["v₀ を √2 倍（約 7.9 km/s）にするとどうなるか。エネルギーのグラフの「和」は？", "脱出する（放物線）。力学的エネルギーの和がちょうど 0。"],
    ["v₀ を 4.0 km/s に下げよう。", "楕円の遠地点から落ちていき、近地点が地球の半径より小さいと地表に落ちる。"],
    ["中心天体を月・火星・木星・太陽にかえよう（r₀ ＝ 2R のまま、v₀ は自動でその位置の円軌道の速さになる）。円軌道の速さと周期はどう変わるか。", "速さは √(GM/r) なので、質量が大きく半径が小さい天体ほど速い（地球 5.6、月 1.2、金星 5.2、火星 2.5、木星 29.8、太陽 309 km/s 付近）。周期は 2π√(r³/GM) で、r ＝ 2R のときは平均密度が小さい天体ほど長い（地球 約4.0 h、月 約5.1 h、金星 約4.1 h、火星 約4.7 h、木星 約8.4 h、太陽 約7.9 h）。"]
  ]
};

/* ---------- ケプラーの第3法則 ---------- */
const PLANETS = [["水星", 0.387, "#9a8f86"], ["金星", 0.723, "#d9b25e"], ["地球", 1.0, "#3a86d6"], ["火星", 1.524, "#d0623b"], ["木星", 5.203, "#c99a6a"], ["土星", 9.537, "#d8c38a"]];
const kepler = {
  label:"ケプラーの第3法則",
  params:[["a","自分で置く惑星の軌道半径",0.3,10,0.05,"天文単位",2,2.5]],
  toggles:[["outer","木星・土星も表示",false]],
  timed:true, graphs:1, wide:[0],
  legend:`<span><i style="background:#e8a32e"></i>太陽</span><span><i style="background:var(--hl2)"></i>自分で置いた惑星</span>`,
  reset(){}, duration(){ return 24; }, step(){},
  draw(ctx){
    const {P, t, T} = ctx; const {c, w, h} = prep(ctx.stage);
    const yrs = t*0.25, list = PLANETS.filter(p => T.outer || p[1] < 3);
    const amax = Math.max(...list.map(p => p[1]), P.a)*1.08;
    const tf = fit(w, h, {x0:-amax, x1:amax, y0:-amax, y1:amax}, 8);
    const ink3 = css("--ink3"), hl2 = css("--hl2"), ink2 = css("--ink2");
    disc(c, tf.X(0), tf.Y(0), 9, "#e8a32e");
    list.concat([["あなたの惑星", P.a, hl2]]).forEach(([n, a, col]) => {
      c.strokeStyle = ink3; c.globalAlpha = 0.5; c.beginPath(); c.arc(tf.X(0), tf.Y(0), a*tf.s, 0, PI2); c.stroke(); c.globalAlpha = 1;
      const Tp = Math.pow(a, 1.5), th = PI2*yrs/Tp, x = a*Math.cos(th), y = a*Math.sin(th);
      disc(c, tf.X(x), tf.Y(y), n === "あなたの惑星" ? 7 : 6, col);
      if(a*tf.s > 22 || n === "あなたの惑星") label(c, n, tf.X(x) + 8, tf.Y(y) - 8, n === "あなたの惑星" ? hl2 : ink2, "left", uiFont(11));
    });
    label(c, `経過 ${f(yrs,2)} 年`, 10, 14, ink2, "left", uiFont(12, true));
    ctx.banner(`あなたの惑星：a ＝ ${f(P.a,2)} 天文単位 → 周期 a^(3/2) ＝ ${f(Math.pow(P.a,1.5),2)} 年`, "--hl2");
    // T vs a^(3/2): straight line
    const pts = PLANETS.filter(p => T.outer || p[1] < 3).map(p => [Math.pow(p[1], 1.5), Math.pow(p[1], 1.5)]);
    const xm = Math.max(...pts.map(p => p[0]), Math.pow(P.a, 1.5))*1.05;
    const gr = graph(ctx.graphs[0], {title:"周期 T（年）と a^(3/2)（横軸）", unit:"", tmax:xm, ylo:0, yhi:xm, series:[{fn:x => x, color:"--ink3"}]});
    PLANETS.filter(p => T.outer || p[1] < 3).forEach(p => { const x = Math.pow(p[1], 1.5); disc(gr.c, gr.X(x), gr.Y(x), 4, p[2]); });
    disc(gr.c, gr.X(Math.pow(P.a,1.5)), gr.Y(Math.pow(P.a,1.5)), 5, hl2);
    const realT = {水星:0.241, 金星:0.615, 地球:1.0, 火星:1.881, 木星:11.86, 土星:29.46};
    ctx.ro(table([["惑星（a〔天文単位〕・実際の T〔年〕）", "T² ÷ a³"]].concat(PLANETS.map(p => [`${p[0]}（${p[1]}・${realT[p[0]]}）`, f(realT[p[0]]**2/p[1]**3, 3)]))));
    ctx.eqs(`<p class="eq">円軌道：${S("m")}${S("r")}${S("ω")}² ＝ ${S("G")}${S("M")}${S("m")}/${S("r")}² → ${S("T")}² ＝ (4π²/${S("G")}${S("M")})${S("r")}³。比例定数は太陽の質量 ${S("M")} だけで決まり、惑星によらない。</p><p class="eq">地球を基準（a ＝ 1 天文単位、T ＝ 1 年）にすると ${S("T")} ＝ ${S("a")}<sup>3/2</sup>。</p>`);
  },
  asks:[
    ["表の T²/a³ を見よう。惑星によって変わるか。", "どれもほぼ 1.00（地球の単位で）。第3法則。"],
    ["自分の惑星の半径を 4 天文単位にすると、周期は何年か。", "4^(3/2) ＝ 8 年。"],
    ["外側の惑星ほど、1周が遅いのはなぜか（2つの理由）。", "軌道が長いことと、速さが遅いこと（v ∝ 1/√r）。だから T ∝ r^(3/2) と、r より速く増える。"]
  ]
};

/* ---------- 打ち上げと第2宇宙速度 ---------- */
const escape = {
  label:"打ち上げと第2宇宙速度",
  params:[["v0","打ち上げる速さ（鉛直上向き）",1,14,0.05,"km/s",2,11.2,vRng]],
  selects:[BODY_SEL],
  timed:true, graphs:2, wide:[0,1],
  legend:`<span><i style="background:var(--pos)"></i>物体</span><span><i style="background:var(--hl2)"></i>位置エネルギー U(r)/m ＝ −GM/r</span><span><i style="background:var(--acc)"></i>力学的エネルギー（一定）</span><span><i style="background:var(--vel)"></i>運動エネルギー</span>`,
  reset(P, St){
    setBody(P.body);
    if((eBody !== null && P.body !== eBody) || (eBody === null && P.body !== "earth" && P.v0 === 11.2)){ const st = vStep(P); P.v0 = +(Math.ceil(Math.sqrt(2*GM/R)/1e3/st - 1e-9)*st).toFixed(2); }
    eBody = P.body;
    const v0 = P.v0*1e3, E = v0*v0/2 - GM/R; St.E = E; St.r = R; St.v = v0; St.tp = 0; St.done = false; St.ts = [[0, 1, P.v0]];
    St.rmax = E < 0 ? GM/(-E) : Infinity;
    let span = 0;
    if(E < 0){ // 上がって落ちてくるまでの時間（数値的に）
      let r = R, v = v0, tt = 0; const hh = 2; while(tt < 3.6e5){ v += -GM/(r*r)*hh; r += v*hh; tt += hh; if(r < R){ break; } } span = tt*1.02;
    } else span = 24*3600;
    St.span = Math.min(span, 48*3600); St.scale = St.span/DISP;
  },
  duration(){ return DISP; },
  step(P, St, dt){
    if(St.done) return;
    let rem = dt*St.scale; const h = St.span/6000;
    while(rem > 0){ const d = Math.min(h, rem); St.v += -GM/(St.r*St.r)*d/2; St.r += St.v*d; St.v += -GM/(St.r*St.r)*d/2; St.tp += d; rem -= d; if(St.r < R){ St.r = R; St.done = true; break; } }
    St.ts.push([St.tp/3600, St.r/R, St.v/1e3]);
  },
  draw(ctx){
    const {P, S:St} = ctx; const {c, w, h} = prep(ctx.stage);
    const top = Math.min(Math.max(St.rmax === Infinity ? 12 : St.rmax/R*1.1, 2), 12);
    const tf = fit(w, h, {x0:-1.3*R, x1:1.3*R, y0:-1.15*R, y1:top*R}, 8);
    const ink2 = css("--ink2"), ink3 = css("--ink3"), pos = css("--pos"), vel = css("--vel");
    earth(c, tf, ink2);

      [`Δ${S("v")} の合計 |Δ${S("v")}<sub>1</sub>| ＋ |Δ${S("v")}<sub>2</sub>|`, `${f((Math.abs(X.d1) + Math.abs(X.d2))/1e3,2)} km/s`], [`遷移にかかる時間 π√(${S("a")}³/${S("G")}${S("M")})`, Tu(X.Th)], [`出発のときの ${X.tg} の位置（出発する側から見て）`, `${X.lead >= 0 ? "前方" : "後方"} ${f(Math.abs(X.lead)*180/Math.PI,1)}°`],
      [`力学的エネルギー（${U.en} /kg）出発 → 遷移 → 到着`, `${fm(e1)} → ${fm(et)} → ${fm(e2)}`]];
    if(St.tb2 != null) rows.push([`シミュレーションで測った遷移時間`, Tu(St.tb2 - St.tb1)]);
    ctx.ro(table(rows));
    const gmTxt = U.key === "sat" ? `${S("G")}${S("M")} ≒ ${sci(U.GM)} m³/s²（${S("R")} ＝ ${sci(U.L)} m、${U.body}）` : `${S("G")}${S("M")}<sub>太陽</sub> ≒ 1.33 × 10²⁰ m³/s²（1 天文単位 ＝ 1.50 × 10¹¹ m）`;
    ctx.eqs(`<p class="eq">${gmTxt}。<b>円軌道の速さ</b> ${S("v")} ＝ √(${S("G")}${S("M")}/${S("r")})（半径が大きいほど遅い）、力学的エネルギー（1 kg）${S("E")} ＝ −${S("G")}${S("M")}/(2${S("r")})</p>
<p class="eq"><b>遷移軌道</b>は、${S("r")}<sub>1</sub> と ${S("r")}<sub>2</sub> を結ぶ楕円（長軸 ＝ ${S("r")}<sub>1</sub> ＋ ${S("r")}<sub>2</sub>、半長軸 ${S("a")} ＝ (${S("r")}<sub>1</sub> ＋ ${S("r")}<sub>2</sub>)/2 ＝ ${f(X.a/U.L,3)} ${U.Ln}）。エネルギー保存と面積速度一定（${S("r")}<sub>1</sub>${S("v")}<sub>p</sub> ＝ ${S("r")}<sub>2</sub>${S("v")}<sub>a</sub>）から</p>
<p class="eq">${S("v")}<sub>${isUp ? "p" : "a"}</sub> ＝ √(2${S("G")}${S("M")}${S("r")}<sub>2</sub> / (${S("r")}<sub>1</sub>(${S("r")}<sub>1</sub> ＋ ${S("r")}<sub>2</sub>))) ＝ ${f(X.vp/1e3,2)} km/s、${S("v")}<sub>${isUp ? "a" : "p"}</sub> ＝ √(2${S("G")}${S("M")}${S("r")}<sub>1</sub> / (${S("r")}<sub>2</sub>(${S("r")}<sub>1</sub> ＋ ${S("r")}<sub>2</sub>))) ＝ ${f(X.va/1e3,2)} km/s。Δ${S("v")}<sub>1</sub> ＝ ${f(X.vp/1e3,2)} − ${f(X.v1/1e3,2)} ＝ ${f(X.d1/1e3,2)} km/s、Δ${S("v")}<sub>2</sub> ＝ ${f(X.v2/1e3,2)} − ${f(X.va/1e3,2)} ＝ ${f(X.d2/1e3,2)} km/s</p>
<p class="eq"><b>遷移の時間</b>：ケプラーの第3法則 ${S("T")}² ∝ ${S("a")}³ より、楕円の周期 ${S("T")} ＝ 2π√(${S("a")}³/${S("G")}${S("M")})、その半分 ＝ ${Tu(X.Th)}。到着点の天体は、出発のとき出発する側から見て${X.lead >= 0 ? "前方" : "後方"} ${f(Math.abs(X.lead)*180/Math.PI,1)}°（＝ 180° − ${S("ω")}<sub>2</sub> × 遷移時間）にいればよい。</p>
<p class="eq" style="color:var(--ink2)">噴射は短い時間で、位置は変わらず速度だけが変わるとして計算。①②とも進行方向（軌道の接線）に噴射する。</p>`);
  },
  asks:[
    ["「低軌道 → 静止軌道」を再生しよう。噴射は何回、どこでするか。なぜ2回なのか。", "2回。①低軌道で加速して楕円（近地点が低軌道、遠地点が静止軌道の高さ）にのせ、②遠地点で再び加速して円軌道にする。①だけだと遠地点で止まらず、また近地点にもどってくる。"],
    ["速さのグラフを見よう。高い軌道は速さが遅いのに、そこへ行くために加速するのはなぜか。", "加速は運動エネルギーを増やし、遠ざかる間に位置エネルギーに変わる。上った先（遠地点）では速さが遅くなるが、力学的エネルギーは出発の円軌道より大きい。到着後の円軌道の速さは出発より小さいが、エネルギーはさらに大きい。"],
    ["「到着点での噴射」を「しない」にしよう。探査機はどうなるか。", "遠地点を通過して楕円軌道を回りつづけ、近地点にもどる。②の加速でエネルギーを足さないと円軌道にならない。"],
    ["「静止軌道 → 低軌道（減速）」にしよう。噴射の向きと、速さのようすを比べよう。", "進行方向と逆向きに噴射（減速）。楕円の近地点（低軌道の高さ）に向かって落ちるように進み、速さは増していく。近地点で再び減速（①と逆の関係）して円軌道にのる。エネルギーは下がる。"],
    ["「人工衛星」の例で、中心天体を月や火星にかえよう。同じ r₁、r₂（R の何倍）のとき、Δv と遷移時間はどう変わるか。", "Δv は √(GM/R) に比例して小さくなる（月は地球の約 1/5）。遷移時間は √(R³/GM) に比例するので、平均密度が小さい天体ほど長くなる。式の形（Δv の比、時間の比）は同じ。"],
    ["「探査機：地球 → 火星」にしよう。出発のとき、火星は地球よりどれだけ先にいればよいか。", "約 44°。遷移にかかる時間（約 259 日）のあいだに、火星（周期 687 日）が進む角度を引いて、ちょうど到着点に着くようにする。"]
  ]
};

LAB.app({title:"万有引力ラボ", modes:{orbit, kepler, escape, transfer}});
})();
